# Non-ferrous metals: sector-wide process flowchart. See appendix_figure-style.qmd.
sector: non-ferrous-metals
title: Non-ferrous metals

nodes:
  - {id: bauxite, label: Bauxite, icon: ore, role: input, at: [0, 0]}
  - {id: scrap, label: Scrap, icon: scrap, role: input, at: [0, 1]}
  - {id: conc, label: Ore concentrates, icon: ore, role: input, at: [0, 2]}
  - {id: feed, label: Magnesium and titanium feed, icon: chemical, role: input, at: [0, 4]}

  - {id: primary-al, label: Primary aluminium, icon: electrolysis, role: process, at: [1, 0],
     branch: non-ferrous-metals.product.aluminum.primary-aluminum}
  - {id: recycle, label: Aluminium recycling, icon: furnace, role: process, at: [1, 1],
     branch: non-ferrous-metals.product.aluminum.recycle}
  - {id: pyro, label: Pyrometallurgy, icon: furnace, role: process, at: [1, 2],
     branches: [non-ferrous-metals.product.copper.pyrometallurgy, non-ferrous-metals.product.nickel.pyrometallurgy,
                non-ferrous-metals.product.lead.pyrometallurgy, non-ferrous-metals.product.zinc.pyrometallurgy]}
  - {id: hydro, label: Hydrometallurgy, icon: reactor, role: process, at: [1, 3],
     branches: [non-ferrous-metals.product.copper.hydrometallurgy, non-ferrous-metals.product.nickel.hydrometallurgy,
                non-ferrous-metals.product.zinc.hydrometallurgy]}
  - {id: mg-ti, label: Magnesium and titanium slag, icon: electrolysis, role: process, at: [1, 4],
     branches: [non-ferrous-metals.product.magnesium.electrolysis, non-ferrous-metals.product.magnesium.thermal-reduction,
                non-ferrous-metals.product.titanium-slag.pyrometallurgy]}
  - {id: melt-cast, label: Melting and casting, icon: ingot, role: process, at: [2, 2],
     branches: [non-ferrous-metals.product.copper.melt-cast, non-ferrous-metals.product.nickel.melt-cast,
                non-ferrous-metals.product.lead.melt-cast, non-ferrous-metals.product.zinc.melt-cast,
                non-ferrous-metals.product.magnesium.melt-cast]}

  - {id: aluminium, label: Aluminium, icon: ingot, role: output, at: [3, 0]}
  - {id: metals, label: Other refined metals, icon: ingot, role: output, at: [3, 2]}

edges:
  - [bauxite, primary-al]
  - [primary-al, aluminium]
  - [scrap, recycle]
  - [recycle, aluminium]
  - [conc, pyro]
  - [conc, hydro]
  - [feed, mg-ti]
  - [pyro, melt-cast]
  - [hydro, melt-cast]
  - {from: mg-ti, to: melt-cast, turn: late}
  - {from: mg-ti, to: metals, turn: late, label: titanium slag}
  - [melt-cast, metals]
