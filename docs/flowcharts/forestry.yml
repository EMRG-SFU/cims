# Forestry process flowchart. See appendix_figure-style.qmd for the format.
# Fuels are shown generically: the equipment options run on diesel blends or
# electricity, and the mix changes over time.
sector: forestry
title: Forestry

nodes:
  - {id: energy, label: Fuels and electricity, icon: electricity, role: input, at: [0, 0]}
  - {id: equipment, label: Harvest equipment, icon: tractor, role: process, at: [1, 0],
     branch: forestry.product.transport}
  - {id: logs, label: Logs at roadside, icon: log, role: output, at: [2, 0]}
  - {id: co2, label: Exhaust CO₂, icon: stack, role: emission, at: [1, 1]}

edges:
  - {from: energy, to: equipment, kind: energy}
  - [equipment, logs]
  - {from: equipment, to: co2, kind: emission}
