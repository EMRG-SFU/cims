# Crude oil process flowchart (sector overview). See appendix_figure-style.qmd for the format.
sector: petroleum-crude
title: Crude oil

nodes:
  # conventional crude
  - {id: exploration, label: Exploration and drilling, icon: well, role: process, at: [0, 0],
     branch: petroleum-crude.product.exploration}
  - {id: completion, label: Well completion, icon: well, role: process, at: [1, 0],
     branch: petroleum-crude.product.completion}
  - {id: light, label: Light-medium crude, icon: offshore, role: process, at: [2, 0],
     branches: [petroleum-crude.product.light-medium.onshore, petroleum-crude.product.light-medium.offshore]}
  - {id: field, label: Field services, icon: pump, role: service, at: [1, 1],
     branches: [petroleum-crude.service.artificial-lift, petroleum-crude.service.treating,
                petroleum-crude.service.produced-water, petroleum-crude.service.field-engines]}
  - {id: heavy, label: Heavy crude, icon: well, role: process, at: [2, 1],
     branch: petroleum-crude.product.heavy}

  # oil sands
  - {id: haulage, label: Haulage and tailings, icon: truck, role: service, at: [1, 2],
     branches: [petroleum-crude.service.mine-haulage, petroleum-crude.service.tailings-disposal]}
  - {id: mining, label: Oil sands mining, icon: open-pit, role: process, at: [2, 2],
     branches: [petroleum-crude.product.bitumen.mining.extraction, petroleum-crude.product.bitumen.mining.froth-treatment]}
  - {id: steam, label: Steam, icon: boiler, role: service, at: [1, 3],
     branch: petroleum-crude.service.steam}
  - {id: in-situ, label: In-situ bitumen, icon: oil-sands, role: process, at: [2, 3],
     branch: petroleum-crude.product.bitumen.in-situ}
  - {id: upgrading, label: Upgrading, icon: refinery, role: process, at: [3, 2],
     branches: [petroleum-crude.product.bitumen.upgrading.primary, petroleum-crude.product.bitumen.upgrading.secondary]}
  - {id: hydrogen, label: Hydrogen supply, icon: hydrogen, role: service, at: [3, 3],
     branch: petroleum-crude.service.hydrogen}

  # transport
  - {id: pumping, label: Pumping, icon: pump, role: service, at: [4, 0],
     branch: petroleum-crude.service.pumping}
  - {id: transmission, label: Crude pipelines, icon: pipeline, role: process, at: [4, 1],
     branch: petroleum-crude.product.transmission}
  - {id: crude, label: Crude oil and bitumen, icon: liquid-fuel, role: output, at: [5, 1]}

edges:
  - [exploration, completion]
  - [completion, light]
  - [completion, heavy]
  - {from: field, to: heavy, kind: energy}
  - {from: haulage, to: mining, kind: energy}
  - {from: steam, to: in-situ, kind: energy}
  - [mining, upgrading]
  - [in-situ, upgrading]
  - {from: hydrogen, to: upgrading, kind: energy}
  - [light, transmission]
  - [heavy, transmission]
  - [upgrading, transmission]
  - {from: in-situ, to: transmission, route: below, label: diluted bitumen}
  - {from: pumping, to: transmission, kind: energy}
  - [transmission, crude]
