# Agriculture process flowchart. See appendix_figure-style.qmd for the format.
# Fuels are shown generically: tractors and farm heaters run on diesel and
# methane blends, hydrogen, or electricity, and the mix changes over time.
sector: agriculture
title: Agriculture

nodes:
  - {id: energy, label: Fuels and electricity, icon: electricity, role: input, at: [0, 1]}
  - {id: tractors, label: Tractors, icon: tractor, role: service, at: [1, 0.5],
     branch: agriculture.service.tractors}
  - {id: heat, label: Farm heat, icon: thermometer, role: service, at: [1, 1.5],
     branch: agriculture.service.heat}
  - {id: livestock, label: Livestock and manure, icon: cow, role: process, at: [2, 0],
     branch: agriculture.product.enteric-fermentation-and-manure-management}
  - {id: soils, label: Cropland soils, icon: soil, role: process, at: [2, 1],
     branch: agriculture.product.soils}
  - {id: ch4, label: Methane (CH₄), icon: methane, role: emission, at: [3, 0]}
  - {id: n2o, label: Nitrous oxide (N₂O), icon: stack, role: emission, at: [3, 1]}

edges:
  - {from: energy, to: tractors, kind: energy}
  - {from: energy, to: heat, kind: energy}
  - {from: tractors, to: livestock, kind: energy}
  - {from: tractors, to: soils, kind: energy}
  - {from: livestock, to: ch4, kind: emission}
  - {from: soils, to: n2o, kind: emission}
