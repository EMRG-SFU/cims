# Hydrogen process flowchart. See appendix_figure-style.qmd for the format.
# The energy source is the sector's main choice (gas, coal, biomass, or
# electricity), so the chart shows it as one generic input.
sector: hydrogen
title: Hydrogen

nodes:
  - {id: resources, label: Energy and feedstock, icon: process, role: input, at: [0, 1]}
  - {id: capture, label: CO₂ capture, icon: ccs, role: emission, at: [1, 0],
     branch: hydrogen.service.ccs.concentrated}
  - {id: production, label: Hydrogen production, icon: electrolysis, role: process, at: [1, 1],
     branch: hydrogen.product.centralized-hydrogen}
  - {id: distribution, label: Distribution and storage, icon: pipeline, role: service, at: [2, 1],
     branch: hydrogen.service.distribution}
  - {id: users, label: Hydrogen users, icon: factory, role: output, at: [3, 1]}

edges:
  - [resources, production]
  - {from: production, to: capture, kind: emission}
  - [production, distribution]
  - [distribution, users]
