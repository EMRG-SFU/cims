# Biofuels process flowchart. See appendix_figure-style.qmd for the format.
sector: biofuels
title: Biofuels

nodes:
  # feedstocks
  - {id: farming, label: Feedstock farming, icon: tractor, role: service, at: [0, 1],
     branch: biofuels.service.agricultural-input}
  - {id: oils, label: Vegetable oils and fats, icon: liquid-fuel, role: input, at: [0, 2.5]}
  - {id: waste, label: Organic waste, icon: landfill, role: input, at: [0, 4]}
  - {id: wood, label: Wood and crop residues, icon: log, role: input, at: [0, 5]}

  # conversion
  - {id: capture, label: CO₂ capture, icon: ccs, role: emission, at: [1, 0],
     branches: [biofuels.service.ccs.concentrated, biofuels.service.ccs.diffuse]}
  - {id: ethanol, label: Ethanol, icon: reactor, role: process, at: [1, 1],
     branch: biofuels.product.ethanol}
  - {id: biodiesel, label: Biodiesel, icon: chemical, role: process, at: [1, 2],
     branch: biofuels.product.biodiesel}
  - {id: renewable-diesel, label: Renewable diesel and SAF, icon: refinery, role: process, at: [1, 3],
     branch: biofuels.product.renewable-diesel-and-saf}
  - {id: rng, label: Renewable natural gas, icon: methane, role: process, at: [1, 4],
     branch: biofuels.product.renewable-natural-gas}
  - {id: pellets, label: Solid biofuel, icon: biomass, role: process, at: [1, 5],
     branch: biofuels.product.solid-biofuel}
  - {id: steam, label: Process steam, icon: boiler, role: service, at: [0, 0],
     branch: biofuels.service.steam}

  # products
  - {id: gasoline-blend, label: Gasoline blend, icon: car, role: output, at: [2, 1]}
  - {id: diesel-blend, label: Diesel and jet fuel blends, icon: truck, role: output, at: [2, 2.5]}
  - {id: gas-blend, label: Natural gas blend, icon: pipeline, role: output, at: [2, 4]}
  - {id: solid-fuel, label: Pellets for heat and power, icon: boiler, role: output, at: [2, 5]}

edges:
  - [farming, ethanol]
  - [farming, biodiesel]
  - [oils, biodiesel]
  - [oils, renewable-diesel]
  - [waste, rng]
  - [wood, pellets]
  - {from: ethanol, to: capture, kind: emission}
  - {from: steam, to: ethanol, kind: energy, turn: late}
  - [ethanol, gasoline-blend]
  - [biodiesel, diesel-blend]
  - [renewable-diesel, diesel-blend]
  - [rng, gas-blend]
  - [pellets, solid-fuel]
