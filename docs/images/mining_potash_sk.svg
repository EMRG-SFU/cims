<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:12px;fill:#1f2a37;}
    .lblw{font-size:12px;fill:#fff;}
    .sub{font-size:9.5px;fill:#43506a;}
    .subw{font-size:9.5px;fill:#dfe7f2;}
    .tag{font-size:9px;fill:#6b7686;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .potash{fill:#8a5a2b;}
    .fixed{fill:#eef1f5;stroke:#c3ccd8;stroke-width:1;}
    .proc{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
  </style>

  <!-- Potash -->
  <rect class="potash" x="310" y="12" width="190" height="44" rx="7"/>
  <text class="lblw" x="405" y="32" text-anchor="middle">Potash (Saskatchewan)</text>
  <text class="subw" x="405" y="47" text-anchor="middle">non-metal product, sibling of Metal</text>

  <!-- Potash -> Processing + finishing -->
  <path class="edge" d="M405,56 V70"/>
  <path class="edge" d="M240,70 H520"/>
  <path class="edge" d="M240,70 V82" marker-end="url(#arrow2)"/>
  <path class="edge" d="M520,70 V99 H540" marker-end="url(#arrow2)"/>
  <path class="edge" d="M520,99 V141 H540" marker-end="url(#arrow2)"/>
  <path class="edge" d="M520,141 V183 H540" marker-end="url(#arrow2)"/>

  <!-- Processing -->
  <rect class="fixed" x="150" y="82" width="180" height="38" rx="6"/>
  <text class="lbl" x="240" y="99" text-anchor="middle">Processing</text>
  <text class="tag" x="240" y="113" text-anchor="middle">fixed ratio</text>

  <!-- finishing -->
  <rect class="proc" x="540" y="84" width="170" height="32" rx="5"/>
  <text class="lbl" x="625" y="104" text-anchor="middle">Drying</text>
  <rect class="proc" x="540" y="126" width="170" height="32" rx="5"/>
  <text class="lbl" x="625" y="146" text-anchor="middle">Compaction</text>
  <rect class="proc" x="540" y="168" width="170" height="32" rx="5"/>
  <text class="lbl" x="625" y="188" text-anchor="middle">Tailings Disposal</text>

  <!-- Processing children -->
  <path class="edge" d="M240,120 V134"/>
  <path class="edge" d="M120,134 H410"/>
  <path class="edge" d="M120,134 V148" marker-end="url(#arrow2)"/>
  <path class="edge" d="M270,134 V148" marker-end="url(#arrow2)"/>
  <path class="edge" d="M410,134 V148" marker-end="url(#arrow2)"/>

  <rect class="proc" x="50" y="148" width="140" height="34" rx="5"/>
  <text class="lbl" x="120" y="169" text-anchor="middle">Crystallization</text>
  <rect class="proc" x="208" y="148" width="124" height="34" rx="5"/>
  <text class="lbl" x="270" y="169" text-anchor="middle">Flotation</text>
  <rect class="fixed" x="340" y="148" width="140" height="34" rx="5"/>
  <text class="lbl" x="410" y="169" text-anchor="middle">Raw Product</text>

  <!-- Raw Product -> mining methods -->
  <path class="edge" d="M410,182 V196"/>
  <path class="edge" d="M300,196 H523"/>
  <path class="edge" d="M300,196 V210" marker-end="url(#arrow2)"/>
  <path class="edge" d="M523,196 V210" marker-end="url(#arrow2)"/>

  <rect class="fixed" x="224" y="210" width="152" height="42" rx="6"/>
  <text class="lbl" x="300" y="228" text-anchor="middle">Conventional Mining</text>
  <text class="tag" x="300" y="243" text-anchor="middle">underground, ~1000 m</text>

  <rect class="fixed" x="448" y="210" width="150" height="42" rx="6"/>
  <text class="lbl" x="523" y="228" text-anchor="middle">Solution Mining</text>
  <text class="tag" x="523" y="243" text-anchor="middle">deep deposits, &gt;1500 m</text>

  <!-- conventional stack -->
  <path class="edge" d="M300,252 V274"/>
  <rect class="proc" x="225" y="274" width="150" height="30" rx="5"/>
  <text class="lbl" x="300" y="293" text-anchor="middle">Extraction</text>
  <path class="edge" d="M300,304 V312"/>
  <rect class="proc" x="225" y="312" width="150" height="30" rx="5"/>
  <text class="lbl" x="300" y="331" text-anchor="middle">Transportation</text>
  <path class="edge" d="M300,342 V350"/>
  <rect class="proc" x="225" y="350" width="150" height="30" rx="5"/>
  <text class="lbl" x="300" y="369" text-anchor="middle">Crush and Screen</text>
  <path class="edge" d="M300,380 V388"/>
  <rect class="proc" x="225" y="388" width="150" height="30" rx="5"/>
  <text class="lbl" x="300" y="407" text-anchor="middle">Dissolution</text>

  <!-- solution stack -->
  <path class="edge" d="M523,252 V274"/>
  <rect class="proc" x="448" y="274" width="150" height="30" rx="5"/>
  <text class="lbl" x="523" y="293" text-anchor="middle">Extraction</text>
  <path class="edge" d="M523,304 V312"/>
  <rect class="proc" x="448" y="312" width="150" height="30" rx="5"/>
  <text class="lbl" x="523" y="331" text-anchor="middle">Transportation</text>

  <text class="tag" x="400" y="468" text-anchor="middle">Conventional and solution mining feed shared processing (crystallization, flotation) and finishing (drying,</text>
  <text class="tag" x="400" y="482" text-anchor="middle">compaction, tailings disposal); both draw on the cross-cutting energy and utility services shown in Figure 1.</text>
</svg>
