<svg width="420" height="380" viewBox="0 0 420 380" xmlns="http://www.w3.org/2000/svg">
  <title>CIMS network tree logo — dark version</title>

  <!-- OFFSET LAYER 1: magenta, tree at (-6,-5), text at (-2.5,-2.5) -->
  <g transform="translate(-6,-5)">
    <line x1="200" y1="65"  x2="105" y2="170" stroke="#FF2D9B" stroke-width="11" stroke-linecap="round"/>
    <line x1="200" y1="65"  x2="295" y2="170" stroke="#FF2D9B" stroke-width="11" stroke-linecap="round"/>
    <line x1="105" y1="170" x2="55"  y2="285" stroke="#FF2D9B" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="105" y1="170" x2="160" y2="285" stroke="#FF2D9B" stroke-width="8.5" stroke-linecap="round"/>
    <circle cx="200" cy="65"  r="31" fill="#FF2D9B"/>
    <circle cx="105" cy="170" r="23" fill="#FF2D9B"/>
    <circle cx="295" cy="170" r="23" fill="#FF2D9B"/>
    <circle cx="55"  cy="285" r="17" fill="#FF2D9B"/>
    <circle cx="160" cy="285" r="17" fill="#FF2D9B"/>
  </g>
  <text x="307.5" y="267.5" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="72" font-weight="700" letter-spacing="6"
    fill="#FF2D9B">cims</text>

  <!-- OFFSET LAYER 2: blue-teal, tree at (+6,+5), text at (+2.5,+2.5) -->
  <g transform="translate(6,5)">
    <line x1="200" y1="65"  x2="105" y2="170" stroke="#00A8C9" stroke-width="11" stroke-linecap="round"/>
    <line x1="200" y1="65"  x2="295" y2="170" stroke="#00A8C9" stroke-width="11" stroke-linecap="round"/>
    <line x1="105" y1="170" x2="55"  y2="285" stroke="#00A8C9" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="105" y1="170" x2="160" y2="285" stroke="#00A8C9" stroke-width="8.5" stroke-linecap="round"/>
    <circle cx="200" cy="65"  r="31" fill="#00A8C9"/>
    <circle cx="105" cy="170" r="23" fill="#00A8C9"/>
    <circle cx="295" cy="170" r="23" fill="#00A8C9"/>
    <circle cx="55"  cy="285" r="17" fill="#00A8C9"/>
    <circle cx="160" cy="285" r="17" fill="#00A8C9"/>
  </g>
  <text x="312.5" y="272.5" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="72" font-weight="700" letter-spacing="6"
    fill="#00A8C9">cims</text>

  <!-- PRIMARY LAYER: white nodes, edges, and text -->
  <g>
    <line x1="200" y1="65"  x2="105" y2="170" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <line x1="200" y1="65"  x2="295" y2="170" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <line x1="105" y1="170" x2="55"  y2="285" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="105" y1="170" x2="160" y2="285" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round"/>
    <circle cx="200" cy="65"  r="31" fill="#ffffff"/>
    <circle cx="105" cy="170" r="23" fill="#ffffff"/>
    <circle cx="295" cy="170" r="23" fill="#ffffff"/>
    <circle cx="55"  cy="285" r="17" fill="#ffffff"/>
    <circle cx="160" cy="285" r="17" fill="#ffffff"/>
  </g>
  <text x="310" y="270" text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="72" font-weight="700" letter-spacing="6"
    fill="#ffffff">cims</text>
</svg>
