<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
    <marker id="darrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:12px;fill:#1f2a37;}
    .lblw{font-size:12px;fill:#fff;}
    .sub{font-size:10px;fill:#43506a;}
    .subw{font-size:10px;fill:#dfe7f2;}
    .li{font-size:9.5px;fill:#243042;}
    .ttl{font-size:11px;font-weight:bold;fill:#1f2a37;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .dedge{stroke:#8a9aa8;stroke-width:1.1;stroke-dasharray:4 3;fill:none;}
    .sector{fill:#33415c;}
    .branch{fill:#4b5d7e;}
    .prod{fill:#3d6ea5;}
    .det{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
    .svc{fill:#e4efe6;stroke:#aacbb0;stroke-width:1;}
    .hl{fill:#cfe3d6;stroke:#3f7d52;stroke-width:1;}
  </style>

  <!-- sector -->
  <rect class="sector" x="430" y="12" width="220" height="46" rx="7"/>
  <text class="lblw" x="540" y="34" text-anchor="middle">Passenger Transportation</text>
  <text class="subw" x="540" y="49" text-anchor="middle">driver: mobility demand (passenger-km)</text>
  <path class="edge" d="M540,58 V72"/>
  <path class="edge" d="M300,72 H780"/>
  <path class="edge" d="M300,72 V84" marker-end="url(#arrow)"/>
  <path class="edge" d="M780,72 V84" marker-end="url(#arrow)"/>

  <!-- product / service -->
  <rect class="branch" x="200" y="86" width="200" height="40" rx="6"/>
  <text class="lblw" x="300" y="103" text-anchor="middle">Product — Mode</text>
  <text class="subw" x="300" y="118" text-anchor="middle">mode competition (shift)</text>
  <rect class="branch" x="712" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="790" y="103" text-anchor="middle">Service — vehicles &amp; transit</text>

  <!-- mode detail -->
  <path class="edge" d="M300,126 V140 H140 V160" marker-end="url(#arrow)"/>
  <rect class="det" x="40" y="160" width="320" height="150" rx="6"/>
  <text class="ttl" x="50" y="178">Urban</text>
  <text class="li" x="50" y="194">SOV · HOV · Public Transit · Walk/Cycle</text>
  <text class="ttl" x="50" y="214">Intercity Land</text>
  <text class="li" x="50" y="230">Passenger Vehicle · Bus · Rail</text>
  <text class="ttl" x="50" y="250">Intercity Air</text>
  <text class="li" x="50" y="266">conventional · efficient · electric · hydrogen</text>
  <text class="sub" x="50" y="290">demand shifts between modes as relative</text>
  <text class="sub" x="50" y="303">(financial + intangible) costs change</text>

  <!-- services -->
  <path class="edge" d="M790,126 V140 H660 V440"/>
  <path class="edge" d="M660,185 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,300 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,360 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,410 H700" marker-end="url(#arrow)"/>

  <rect class="hl" x="700" y="156" width="340" height="88" rx="6"/>
  <text class="lbl" x="870" y="174" text-anchor="middle">Passenger Vehicles + Motors</text>
  <text class="sub" x="870" y="190" text-anchor="middle">size: small/large car, light truck</text>
  <text class="sub" x="870" y="206" text-anchor="middle">powertrains: gasoline (std→eff) · hybrid ·</text>
  <text class="sub" x="870" y="220" text-anchor="middle">plug-in hybrid · BEV (by range) · fuel cell</text>
  <text class="sub" x="870" y="236" text-anchor="middle">set for new vehicles; stock turns over</text>

  <rect class="hl" x="700" y="252" width="340" height="44" rx="6"/>
  <text class="lbl" x="870" y="270" text-anchor="middle">Transit</text>
  <text class="sub" x="870" y="285" text-anchor="middle">Public Bus (diesel/hybrid/electric) · Rapid Transit</text>

  <rect class="svc" x="700" y="304" width="340" height="44" rx="6"/>
  <text class="lbl" x="870" y="322" text-anchor="middle">Intercity Bus</text>
  <text class="sub" x="870" y="337" text-anchor="middle">diesel · gasoline · hybrid · biodiesel · NG · hydrogen</text>

  <rect class="hl" x="700" y="356" width="340" height="44" rx="6"/>
  <text class="lbl" x="870" y="374" text-anchor="middle">Intercity Rail</text>
  <text class="sub" x="870" y="389" text-anchor="middle">diesel (eff) · electric · hydrogen · biodiesel</text>

  <text class="sub" x="870" y="425" text-anchor="middle">Intangible costs (range, fuelling, preference) shape every choice.</text>

  <!-- legend -->
  <rect class="prod" x="40" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="62" y="570">mobility demand / mode</text>
  <rect class="svc" x="240" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="262" y="570">vehicle / transit service</text>
  <rect class="hl" x="430" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="452" y="570">electrification-capable</text>
</svg>
