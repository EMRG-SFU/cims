<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
    <marker id="darrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:12px;fill:#1f2a37;}
    .lblw{font-size:12px;fill:#fff;}
    .sub{font-size:10px;fill:#43506a;}
    .subw{font-size:10px;fill:#dfe7f2;}
    .li{font-size:9.5px;fill:#243042;}
    .ttl{font-size:11px;font-weight:bold;fill:#1f2a37;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .dedge{stroke:#8a9aa8;stroke-width:1.1;stroke-dasharray:4 3;fill:none;}
    .sector{fill:#33415c;}
    .branch{fill:#4b5d7e;}
    .prod{fill:#3d6ea5;}
    .det{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
    .hot{fill:#f3dede;stroke:#c97b7b;stroke-width:1;}
    .ccs{fill:#f3e7d3;stroke:#d6b483;stroke-width:1;}
    .svc{fill:#e4efe6;stroke:#aacbb0;stroke-width:1;}
  </style>

  <!-- sector -->
  <rect class="sector" x="430" y="12" width="220" height="46" rx="7"/>
  <text class="lblw" x="540" y="34" text-anchor="middle">Petroleum Crude sector</text>
  <text class="subw" x="540" y="49" text-anchor="middle">driver: crude / bitumen output (bbl)</text>
  <path class="edge" d="M540,58 V72"/>
  <path class="edge" d="M300,72 H780"/>
  <path class="edge" d="M300,72 V84" marker-end="url(#arrow)"/>
  <path class="edge" d="M780,72 V84" marker-end="url(#arrow)"/>

  <!-- product / service -->
  <rect class="branch" x="200" y="86" width="200" height="40" rx="6"/>
  <text class="lblw" x="300" y="103" text-anchor="middle">Product — production routes</text>
  <rect class="branch" x="712" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="790" y="103" text-anchor="middle">Service — energy &amp; CCS</text>

  <!-- product detail -->
  <path class="edge" d="M300,126 V140 H120 V160" marker-end="url(#arrow)"/>
  <rect class="det" x="40" y="160" width="320" height="80" rx="6"/>
  <text class="ttl" x="50" y="178">Conventional crude</text>
  <text class="li" x="50" y="195">Light/Medium — Onshore · Offshore</text>
  <text class="li" x="50" y="211">Heavy · Exploration</text>
  <text class="sub" x="50" y="230">Saskatchewan, Atlantic (offshore), AB</text>

  <rect class="det" x="40" y="252" width="320" height="120" rx="6"/>
  <text class="ttl" x="50" y="270">Oil sands (Bitumen) — Alberta</text>
  <text class="li" x="50" y="288">In-Situ: SAGD · SAGD ELDAR · Cyclic Steam ·</text>
  <text class="li" x="60" y="302" style="fill:#2c6e49">Solvent · Hybrid Thermal-Solvent (less steam)</text>
  <text class="li" x="50" y="320">Mining: Existing · Improved</text>
  <text class="li" x="50" y="338">Upgrading → synthetic crude:</text>
  <text class="li" x="60" y="352">conventional · Efficient · ELDAR · ELDAR + CCS</text>
  <text class="sub" x="50" y="368">steam demand drives in-situ carbon intensity</text>

  <!-- services -->
  <path class="edge" d="M790,126 V140 H660 V440"/>
  <path class="edge" d="M660,190 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,300 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,360 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,410 H700" marker-end="url(#arrow)"/>

  <rect class="hot" x="700" y="156" width="340" height="90" rx="6"/>
  <text class="lbl" x="870" y="174" text-anchor="middle">Steam (dominant in-situ load)</text>
  <text class="sub" x="870" y="190" text-anchor="middle">NG / HFO / petcoke boiler (±CCS)</text>
  <text class="sub" x="870" y="205" text-anchor="middle">NG cogeneration (±CCS)</text>
  <text class="sub" x="870" y="220" text-anchor="middle" style="fill:#2c6e49">electric · hydrogen · nuclear</text>
  <text class="sub" x="870" y="236" text-anchor="middle">+ Still Gas Steam (boiler / cogen ±CCS)</text>

  <rect class="svc" x="700" y="256" width="340" height="36" rx="6"/>
  <text class="lbl" x="870" y="272" text-anchor="middle">Hydrogen (for upgrading)</text>
  <text class="sub" x="870" y="287" text-anchor="middle">grey / blue / green — see Hydrogen chapter</text>

  <rect class="svc" x="700" y="344" width="340" height="32" rx="6"/>
  <text class="lbl" x="870" y="364" text-anchor="middle">Industrial Engines (diesel / gasoline / propane)</text>

  <rect class="ccs" x="700" y="392" width="340" height="44" rx="6"/>
  <text class="lbl" x="870" y="410" text-anchor="middle">CCS — 90% capture</text>
  <text class="sub" x="870" y="425" text-anchor="middle">Pathways Alliance network; steam, upgrading, still gas</text>

  <path class="dedge" d="M360,300 C520,300 560,220 700,200" marker-end="url(#darrow)"/>
  <text class="sub" x="540" y="290" text-anchor="middle">service requests (steam, H₂, CO₂)</text>

  <!-- legend -->
  <rect class="prod" x="40" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="62" y="570">production route</text>
  <rect class="hot" x="200" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="222" y="570">steam (main emission driver)</text>
  <rect class="ccs" x="420" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="442" y="570">CCS</text>
  <rect class="svc" x="500" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="522" y="570">other energy service</text>
</svg>
