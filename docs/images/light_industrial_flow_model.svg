<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
    <marker id="darrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:12px;fill:#1f2a37;}
    .lblw{font-size:12px;fill:#fff;}
    .sub{font-size:10px;fill:#43506a;}
    .subw{font-size:10px;fill:#dfe7f2;}
    .li{font-size:9.5px;fill:#243042;}
    .ttl{font-size:11px;font-weight:bold;fill:#1f2a37;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .dedge{stroke:#8a9aa8;stroke-width:1.1;stroke-dasharray:4 3;fill:none;}
    .sector{fill:#33415c;}
    .branch{fill:#4b5d7e;}
    .prod{fill:#3d6ea5;}
    .det{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
    .svc{fill:#e4efe6;stroke:#aacbb0;stroke-width:1;}
  </style>

  <!-- sector -->
  <rect class="sector" x="430" y="12" width="220" height="46" rx="7"/>
  <text class="lblw" x="540" y="34" text-anchor="middle">Light Industrial sector</text>
  <text class="subw" x="540" y="49" text-anchor="middle">driver: manufacturing output (M$ RDP)</text>
  <path class="edge" d="M540,58 V72"/>
  <path class="edge" d="M300,72 H780"/>
  <path class="edge" d="M300,72 V84" marker-end="url(#arrow)"/>
  <path class="edge" d="M780,72 V84" marker-end="url(#arrow)"/>

  <!-- product / service branch -->
  <rect class="branch" x="222" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="300" y="103" text-anchor="middle">Product</text>
  <text class="subw" x="300" y="118" text-anchor="middle">manufacturing sub-groups</text>
  <rect class="branch" x="702" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="780" y="103" text-anchor="middle">Service</text>
  <text class="subw" x="780" y="118" text-anchor="middle">generic energy services</text>

  <!-- Product detail -->
  <path class="edge" d="M300,126 V140 H160 V160" marker-end="url(#arrow)"/>
  <rect class="det" x="40" y="160" width="240" height="180" rx="6"/>
  <text class="ttl" x="50" y="178">Manufacturing sub-groups</text>
  <text class="li" x="50" y="197">• Food, Tobacco &amp; Beverage (largest)</text>
  <text class="li" x="50" y="214">• Rubber &amp; Plastics</text>
  <text class="li" x="50" y="231">• Leather &amp; Textiles</text>
  <text class="li" x="50" y="248">• Wood Products</text>
  <text class="li" x="50" y="265">• Furniture, Printing &amp; Machinery</text>
  <text class="li" x="50" y="282">• Transportation Equipment</text>
  <text class="li" x="50" y="299">• Electronics &amp; Other</text>
  <text class="sub" x="50" y="322">each: RDP × energy intensity →</text>
  <text class="sub" x="50" y="335">requests on the shared services</text>

  <!-- service detail -->
  <path class="edge" d="M780,126 V140 H640 V470"/>
  <path class="edge" d="M640,170 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,232 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,280 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,328 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,376 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,424 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,462 H700" marker-end="url(#arrow)"/>

  <rect class="svc" x="700" y="150" width="340" height="48" rx="6"/>
  <text class="lbl" x="870" y="167" text-anchor="middle">Heat (process heat)</text>
  <text class="sub" x="870" y="182" text-anchor="middle">Direct: NG · electric · oil · wood waste</text>
  <text class="sub" x="870" y="194" text-anchor="middle">Indirect: electric  (+ heat pumps — TODO)</text>

  <rect class="svc" x="700" y="208" width="340" height="44" rx="6"/>
  <text class="lbl" x="870" y="225" text-anchor="middle">Steam</text>
  <text class="sub" x="870" y="240" text-anchor="middle">NG · biomass · electric · H₂ · cogen</text>

  <rect class="svc" x="700" y="262" width="340" height="32" rx="6"/>
  <text class="lbl" x="870" y="282" text-anchor="middle">Water Heating — NG / electric (std→high-eff)</text>

  <rect class="svc" x="700" y="304" width="340" height="34" rx="6"/>
  <text class="lbl" x="870" y="325" text-anchor="middle">Machine Drive — EIA MECS end uses</text>

  <rect class="svc" x="700" y="348" width="340" height="32" rx="6"/>
  <text class="lbl" x="870" y="368" text-anchor="middle">HVAC (shell efficiency + electric/NG)</text>

  <rect class="svc" x="700" y="390" width="340" height="32" rx="6"/>
  <text class="lbl" x="870" y="410" text-anchor="middle">Lighting (base → most efficient)</text>

  <rect class="svc" x="700" y="432" width="340" height="32" rx="6"/>
  <text class="lbl" x="870" y="452" text-anchor="middle">Methane Blend — NG · biogas · biomass gas · H₂</text>

  <!-- service request arrow -->
  <path class="dedge" d="M280,250 C460,250 520,200 700,180" marker-end="url(#darrow)"/>
  <text class="sub" x="470" y="236" text-anchor="middle">service requests (GJ per M$ output)</text>

  <text class="sub" x="870" y="490" text-anchor="middle">No process emissions: all CO₂ is from fuel combustion in these services.</text>

  <!-- legend -->
  <rect class="prod" x="40" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="62" y="570">manufacturing output</text>
  <rect class="det" x="220" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="242" y="570">aggregate sub-groups</text>
  <rect class="svc" x="420" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="442" y="570">shared energy / utility service (all detail here)</text>
</svg>
