<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 420" width="486" height="420" font-family="'Source Sans Pro', 'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Style sample process flowchart">
<defs>
<symbol id="icon-boiler" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="8" width="28" height="26" rx="6" fill="currentColor" fill-opacity="0.18"/><path d="M16 42 c-3-4 3-5 0-8 M24 42 c-3-4 3-5 0-8 M32 42 c-3-4 3-5 0-8"/><path d="M38 14 H44 V4"/></g></symbol>
<symbol id="icon-ccs" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 30 A8 8 0 0 1 10 14 A10 10 0 0 1 29 11 A8 8 0 0 1 31 30 Z"/><path d="M20 22 V40 M14 34 L20 40 L26 34"/><text x="20" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" stroke="none">CO₂</text></g></symbol>
<symbol id="icon-coil" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="11"/><circle cx="24" cy="24" r="5"/></g></symbol>
<symbol id="icon-furnace" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14 H40 V38 H8 Z"/><path d="M8 22 H40" /><path d="M17 38 c-3-4 3-5 0-9 M24 38 c-3-4 3-5 0-9 M31 38 c-3-4 3-5 0-9"/><path d="M33 14 V6 H38 V14"/></g></symbol>
<symbol id="icon-ore" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 39 L13 26 L21 30 L28 18 L37 23 L43 39 Z" fill="currentColor" fill-opacity="0.18"/><path d="M13 26 L17 39 M28 18 L25 39 M37 23 L33 39"/></g></symbol>
<marker id="arrow-material" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3cad3"/></marker>
<marker id="arrow-energy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eda15c"/></marker>
<marker id="arrow-emission" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8f9aa6"/></marker>
</defs>
<path d="M 152.0 210.0 L 184.0 210.0" fill="none" stroke="#c3cad3" stroke-width="1.7" marker-end="url(#arrow-material)"/>
<path d="M 302.0 210.0 L 334.0 210.0" fill="none" stroke="#c3cad3" stroke-width="1.7" marker-end="url(#arrow-material)"/>
<path d="M 243.0 293.0 L 243.0 255.0" fill="none" stroke="#eda15c" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-energy)"/>
<path d="M 243.0 165.0 L 243.0 127.0" fill="none" stroke="#8f9aa6" stroke-width="1.7" stroke-dasharray="1.5 3.5" marker-end="url(#arrow-emission)"/>
<g><title>Purchased input</title>
<rect x="34.0" y="165.0" width="118" height="90" rx="10" fill="#3a3226" stroke="#c9a979" stroke-width="1.4"/>
<use href="#icon-ore" x="74.0" y="173.0" width="38" height="38" style="color:#e6cc9f"/>
<text x="93.0" y="228.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6e9ec">Purchased</text>
<text x="93.0" y="244.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6e9ec">input</text>
</g>
<g><title>Process step</title>
<rect x="184.0" y="165.0" width="118" height="90" rx="10" fill="#1f3550" stroke="#6fa0d8" stroke-width="1.4"/>
<use href="#icon-furnace" x="224.0" y="173.0" width="38" height="38" style="color:#acd0f4"/>
<text x="243.0" y="236.3" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6e9ec">Process step</text>
</g>
<g><title>Product</title>
<rect x="334.0" y="165.0" width="118" height="90" rx="10" fill="#acd0f4" stroke="#acd0f4" stroke-width="1.4"/>
<use href="#icon-coil" x="374.0" y="173.0" width="38" height="38" style="color:#13233a"/>
<text x="393.0" y="236.3" text-anchor="middle" font-size="13.5" font-weight="600" fill="#13233a">Product</text>
</g>
<g><title>Site service</title>
<rect x="184.0" y="293.0" width="118" height="90" rx="10" fill="#21392a" stroke="#78b386" stroke-width="1.4"/>
<use href="#icon-boiler" x="224.0" y="301.0" width="38" height="38" style="color:#acdcb6"/>
<text x="243.0" y="364.3" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6e9ec">Site service</text>
</g>
<g><title>Emission or capture</title>
<rect x="184.0" y="37.0" width="118" height="90" rx="10" fill="#2b2f34" stroke="#8f9aa6" stroke-width="1.4" stroke-dasharray="4 3"/>
<use href="#icon-ccs" x="224.0" y="45.0" width="38" height="38" style="color:#c3cad3"/>
<text x="243.0" y="100.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6e9ec">Emission or</text>
<text x="243.0" y="116.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6e9ec">capture</text>
</g>
</svg>
