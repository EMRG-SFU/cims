<path d="M 152.0 82.0 L 164.0 82.0 Q 171.0 82.0 171.0 89.0 L 171.0 197.5 Q 171.0 204.0 177.5 204.0 L 184.0 204.0" fill="none" stroke="#c3cad3" stroke-width="1.7" marker-end="url(#arrow-material)"/>
