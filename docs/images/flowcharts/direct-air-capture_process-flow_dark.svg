<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 636 341" width="636" height="341" font-family="'Source Sans Pro', 'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Direct air capture process flowchart">
<defs>
