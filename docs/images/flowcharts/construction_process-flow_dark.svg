<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 492" width="486" height="492" font-family="'Source Sans Pro', 'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Construction process flowchart">
