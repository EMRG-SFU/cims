<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 364" width="486" height="364" font-family="'Source Sans Pro', 'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Construction process flowchart">
<defs>
<symbol id="icon-building" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="6" width="28" height="36" fill="currentColor" fill-opacity="0.18"/><path d="M16 13 H20 M28 13 H32 M16 20 H20 M28 20 H32 M16 27 H20 M28 27 H32 M21 42 V35 H27 V42 M4 42 H44"/></g></symbol>
<symbol id="icon-electricity" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M27 4 L11 27 H23 L20 44 L37 19 H25 Z" fill="currentColor" fill-opacity="0.18"/></g></symbol>
<symbol id="icon-stack" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 44 L17 14 H25 L28 44 Z" fill="currentColor" fill-opacity="0.18"/><path d="M21 10 C17 6 23 3 27 5 C31 2 38 4 37 9 C42 10 41 16 36 16 C33 19 27 18 26 15"/></g></symbol>
<symbol id="icon-truck" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 H28 V34 H4 Z" fill="currentColor" fill-opacity="0.18"/><path d="M28 22 H37 L43 28 V34 H28"/><circle cx="12" cy="36" r="4"/><circle cx="35" cy="36" r="4"/></g></symbol>
<marker id="arrow-material" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3cad3"/></marker>
<marker id="arrow-energy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eda15c"/></marker>
<marker id="arrow-emission" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8f9aa6"/></marker>
</defs>
<path d="M 152.0 210.0 L 184.0 210.0" fill="none" stroke="#eda15c" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-energy)"/>
<path d="M 302.0 210.0 L 334.0 210.0" fill="none" stroke="#c3cad3" stroke-width="1.7" marker-end="url(#arrow-material)"/>
<path d="M 243.0 165.0 L 243.0 89.0 Q 243.0 82.0 250.0 82.0 L 334.0 82.0" fill="none" stroke="#8f9aa6" stroke-width="1.7" stroke-dasharray="1.5 3.5" marker-end="url(#arrow-emission)"/>
<g><title>Fuels and electricity</title>
<rect x="34.0" y="165.0" width="118" height="90" rx="10" fill="#3a3226" stroke="#c9a979" stroke-width="1.4"/>
<use href="#icon-electricity" x="74.0" y="173.0" width="38" height="38" style="color:#e6cc9f"/>
<text x="93.0" y="228.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6e9ec">Fuels and</text>
<text x="93.0" y="244.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6e9ec">electricity</text>
</g>
<g><title>Site equipment — construction.product.transport</title>
<rect x="184.0" y="165.0" width="118" height="90" rx="10" fill="#1f3550" stroke="#6fa0d8" stroke-width="1.4"/>
<use href="#icon-truck" x="224.0" y="173.0" width="38" height="38" style="color:#acd0f4"/>
<text x="243.0" y="236.3" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6e9ec">Site equipment</text>
</g>
<g><title>Building and civil works</title>
<rect x="334.0" y="165.0" width="118" height="90" rx="10" fill="#acd0f4" stroke="#acd0f4" stroke-width="1.4"/>
<use href="#icon-building" x="374.0" y="173.0" width="38" height="38" style="color:#13233a"/>
<text x="393.0" y="228.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#13233a">Building and</text>
<text x="393.0" y="244.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#13233a">civil works</text>
</g>
<g><title>Exhaust CO₂</title>
<rect x="334.0" y="37.0" width="118" height="90" rx="10" fill="#2b2f34" stroke="#8f9aa6" stroke-width="1.4" stroke-dasharray="4 3"/>
<use href="#icon-stack" x="374.0" y="45.0" width="38" height="38" style="color:#c3cad3"/>
<text x="393.0" y="108.3" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e6e9ec">Exhaust CO₂</text>
</g>
<rect x="22.0" y="290" width="16" height="12" rx="3" fill="#3a3226" stroke="#c9a979"/>
<text x="44.0" y="300" font-size="11.5" fill="#a3acb6">Purchased input</text>
<rect x="157.4" y="290" width="16" height="12" rx="3" fill="#1f3550" stroke="#6fa0d8"/>
<text x="179.4" y="300" font-size="11.5" fill="#a3acb6">Process step</text>
<rect x="274.6" y="290" width="16" height="12" rx="3" fill="#acd0f4" stroke="#acd0f4"/>
<text x="296.6" y="300" font-size="11.5" fill="#a3acb6">Product</text>
<rect x="22.0" y="313.0" width="16" height="12" rx="3" fill="#2b2f34" stroke="#8f9aa6" stroke-dasharray="4 3"/>
<text x="44.0" y="323.0" font-size="11.5" fill="#a3acb6">Emission or capture</text>
<path d="M 181.8 319.0 H 209.8" stroke="#c3cad3" stroke-width="1.7" marker-end="url(#arrow-material)"/>
<text x="217.8" y="323.0" font-size="11.5" fill="#a3acb6">Material flow</text>
<path d="M 22.0 342.0 H 50.0" stroke="#eda15c" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-energy)"/>
<text x="58.0" y="346.0" font-size="11.5" fill="#a3acb6">Energy or service</text>
<path d="M 183.6 342.0 H 211.6" stroke="#8f9aa6" stroke-width="1.7" stroke-dasharray="1.5 3.5" marker-end="url(#arrow-emission)"/>
<text x="219.6" y="346.0" font-size="11.5" fill="#a3acb6">CO₂ or other emissions</text>
</svg>
