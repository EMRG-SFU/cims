<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 428" width="486" height="428" font-family="'Source Sans Pro', 'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Forestry process flowchart">
<defs>
