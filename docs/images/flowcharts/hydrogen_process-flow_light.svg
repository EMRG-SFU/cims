<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 636 341" width="636" height="341" font-family="'Source Sans Pro', 'Source Sans 3', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Hydrogen process flowchart">
<defs>
<symbol id="icon-ccs" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 30 A8 8 0 0 1 10 14 A10 10 0 0 1 29 11 A8 8 0 0 1 31 30 Z"/><path d="M20 22 V40 M14 34 L20 40 L26 34"/><text x="20" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" stroke="none">CO₂</text></g></symbol>
<symbol id="icon-electrolysis" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16 V40 H42 V16"/><path d="M6 26 H42" stroke-dasharray="3 3"/><path d="M15 8 V34 M33 8 V34"/><path d="M22 4 L19 10 H24 L21 16" /></g></symbol>
<symbol id="icon-factory" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 42 V24 L14 18 V24 L24 18 V24 L34 18 V42 Z" fill="currentColor" fill-opacity="0.18"/><path d="M34 42 V8 H40 V42 M2 42 H46"/></g></symbol>
<symbol id="icon-pipeline" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 H45 M3 30 H45"/><path d="M14 14 V34 M34 14 V34" stroke-width="4"/></g></symbol>
<symbol id="icon-process" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="10" width="32" height="28" rx="4" fill="currentColor" fill-opacity="0.18"/><path d="M16 24 H32 M26 18 L32 24 L26 30"/></g></symbol>
<marker id="arrow-material" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5563"/></marker>
<marker id="arrow-energy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0691f"/></marker>
<marker id="arrow-emission" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a96a3"/></marker>
</defs>
<path d="M 152.0 210.0 L 184.0 210.0" fill="none" stroke="#4a5563" stroke-width="1.7" marker-end="url(#arrow-material)"/>
<path d="M 243.0 165.0 L 243.0 127.0" fill="none" stroke="#8a96a3" stroke-width="1.7" stroke-dasharray="1.5 3.5" marker-end="url(#arrow-emission)"/>
