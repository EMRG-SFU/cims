<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
    <marker id="darrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:12px;fill:#1f2a37;}
    .lblw{font-size:12px;fill:#fff;}
    .sub{font-size:10px;fill:#43506a;}
    .subw{font-size:10px;fill:#dfe7f2;}
    .li{font-size:9.5px;fill:#243042;}
    .ttl{font-size:11px;font-weight:bold;fill:#1f2a37;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .dedge{stroke:#8a9aa8;stroke-width:1.1;stroke-dasharray:4 3;fill:none;}
    .sector{fill:#33415c;}
    .branch{fill:#4b5d7e;}
    .prod{fill:#3d6ea5;}
    .det{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
    .hot{fill:#f3dede;stroke:#c97b7b;stroke-width:1;}
    .ccs{fill:#f3e7d3;stroke:#d6b483;stroke-width:1;}
    .svc{fill:#e4efe6;stroke:#aacbb0;stroke-width:1;}
  </style>

  <!-- sector -->
  <rect class="sector" x="430" y="12" width="220" height="46" rx="7"/>
  <text class="lblw" x="540" y="34" text-anchor="middle">Petroleum Refining sector</text>
  <text class="subw" x="540" y="49" text-anchor="middle">driver: refinery throughput / products</text>
  <path class="edge" d="M540,58 V72"/>
  <path class="edge" d="M300,72 H780"/>
  <path class="edge" d="M300,72 V84" marker-end="url(#arrow)"/>
  <path class="edge" d="M780,72 V84" marker-end="url(#arrow)"/>

  <!-- product / service -->
  <rect class="branch" x="200" y="86" width="200" height="40" rx="6"/>
  <text class="lblw" x="300" y="103" text-anchor="middle">Product — process chain</text>
  <rect class="branch" x="712" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="790" y="103" text-anchor="middle">Service — energy &amp; CCS</text>

  <!-- product detail -->
  <path class="edge" d="M300,126 V140 H120 V160" marker-end="url(#arrow)"/>
  <rect class="det" x="40" y="160" width="320" height="200" rx="6"/>
  <text class="ttl" x="50" y="178">Refined Petroleum Products</text>
  <text class="li" x="50" y="196">Distillation — Atmospheric · Vacuum</text>
  <text class="li" x="50" y="213">Cracked Gas Oil — Coking · Hydrocracking</text>
  <text class="li" x="60" y="227">(low / medium / high conversion)</text>
  <text class="li" x="50" y="244">Hydrotreating — Desulphurisation ·</text>
  <text class="li" x="60" y="258">Sulphur Recovery</text>
  <text class="li" x="50" y="275">Reforming (octane, aromatics, H₂)</text>
  <text class="li" x="50" y="292">Alkylation · Isomerisation</text>
  <text class="li" x="50" y="309">By-products: Asphalt · Lubes</text>
  <text class="sub" x="50" y="332">process units set the demand for heat,</text>
  <text class="sub" x="50" y="346">steam and hydrogen</text>

  <!-- services -->
  <path class="edge" d="M790,126 V140 H660 V450"/>
  <path class="edge" d="M660,185 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,260 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,320 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,380 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,425 H700" marker-end="url(#arrow)"/>

  <rect class="hot" x="700" y="156" width="340" height="58" rx="6"/>
  <text class="lbl" x="870" y="174" text-anchor="middle">Direct Heat (process furnaces)</text>
  <text class="sub" x="870" y="190" text-anchor="middle">NG/oil/LPG/petcoke (±eff) ·</text>
  <text class="sub" x="870" y="204" text-anchor="middle" style="fill:#2c6e49">electric heaters · (hydrogen firing)</text>

  <rect class="hot" x="700" y="222" width="340" height="56" rx="6"/>
  <text class="lbl" x="870" y="240" text-anchor="middle">Steam · Still Gas</text>
  <text class="sub" x="870" y="256" text-anchor="middle">fuels (±CCS) · cogen · electric · hydrogen</text>
  <text class="sub" x="870" y="270" text-anchor="middle">still gas = refinery's own off-gas fuel</text>

  <rect class="svc" x="700" y="286" width="340" height="50" rx="6"/>
  <text class="lbl" x="870" y="304" text-anchor="middle">Hydrogen</text>
  <text class="sub" x="870" y="320" text-anchor="middle">SMR · SMR Eff · SMR Eff + CCS (blue)</text>

  <rect class="ccs" x="700" y="344" width="340" height="44" rx="6"/>
  <text class="lbl" x="870" y="362" text-anchor="middle">CCS — 90% capture</text>
  <text class="sub" x="870" y="377" text-anchor="middle">concentrated streams (H₂ plant, units) — low-cost</text>

  <rect class="svc" x="700" y="396" width="340" height="44" rx="6"/>
  <text class="lbl" x="870" y="414" text-anchor="middle">Machine Drive · HVAC · Lighting</text>
  <text class="sub" x="870" y="429" text-anchor="middle">+ Methane Blend</text>

  <path class="dedge" d="M360,250 C520,230 560,210 700,190" marker-end="url(#darrow)"/>
  <text class="sub" x="540" y="250" text-anchor="middle">service requests (heat, steam, H₂, CO₂)</text>

  <!-- legend -->
  <rect class="prod" x="40" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="62" y="570">process unit</text>
  <rect class="hot" x="180" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="202" y="570">process heat / steam (main emissions)</text>
  <rect class="ccs" x="430" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="452" y="570">CCS</text>
  <rect class="svc" x="510" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="532" y="570">other service</text>
</svg>
