<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
    <marker id="darrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:12px;fill:#1f2a37;}
    .lblw{font-size:12px;fill:#fff;}
    .sub{font-size:10px;fill:#43506a;}
    .subw{font-size:10px;fill:#dfe7f2;}
    .li{font-size:9.5px;fill:#243042;}
    .ttl{font-size:11px;font-weight:bold;fill:#1f2a37;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .dedge{stroke:#8a9aa8;stroke-width:1.1;stroke-dasharray:4 3;fill:none;}
    .sector{fill:#33415c;}
    .branch{fill:#4b5d7e;}
    .prod{fill:#3d6ea5;}
    .det{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
    .svc{fill:#e4efe6;stroke:#aacbb0;stroke-width:1;}
    .hl{fill:#cfe3d6;stroke:#3f7d52;stroke-width:1;}
  </style>

  <!-- sector -->
  <rect class="sector" x="430" y="12" width="220" height="46" rx="7"/>
  <text class="lblw" x="540" y="34" text-anchor="middle">Residential sector</text>
  <text class="subw" x="540" y="49" text-anchor="middle">driver: number of households</text>
  <path class="edge" d="M540,58 V72"/>
  <path class="edge" d="M300,72 H780"/>
  <path class="edge" d="M300,72 V84" marker-end="url(#arrow)"/>
  <path class="edge" d="M780,72 V84" marker-end="url(#arrow)"/>

  <!-- product / service -->
  <rect class="branch" x="200" y="86" width="200" height="40" rx="6"/>
  <text class="lblw" x="300" y="103" text-anchor="middle">Product — Dwelling stock</text>
  <text class="subw" x="300" y="118" text-anchor="middle">type × vintage × climate</text>
  <rect class="branch" x="712" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="790" y="103" text-anchor="middle">Service — end uses</text>

  <!-- dwelling detail -->
  <path class="edge" d="M300,126 V140 H140 V160" marker-end="url(#arrow)"/>
  <rect class="det" x="40" y="160" width="320" height="210" rx="6"/>
  <text class="ttl" x="50" y="178">Building Type</text>
  <text class="li" x="50" y="196">• High Density (apartments)</text>
  <text class="li" x="50" y="212">• Low-Med Density (detached, row, low-rise)</text>
  <text class="ttl" x="50" y="232">× Vintage (building-code era)</text>
  <text class="li" x="50" y="248">&lt;1960 · 1961–80 · 1981–2000 ·</text>
  <text class="li" x="50" y="263">2001–20 · 2021–35 · &gt;2035</text>
  <text class="ttl" x="50" y="283">× Heating (Cold / Marine)</text>
  <text class="li" x="50" y="299" style="fill:#2c6e49">ASHP (±elec/gas backup) · GSHP · hybrid</text>
  <text class="li" x="50" y="313">gas/oil furnace (std→high-eff) · electric · wood</text>
  <text class="li" x="50" y="330">+ Cooling (Central / Room)</text>
  <text class="sub" x="50" y="352">vintage &amp; shell set the heat load;</text>
  <text class="sub" x="50" y="365">retrofits move stock to better cohorts</text>

  <!-- services -->
  <path class="edge" d="M790,126 V140 H660 V440"/>
  <path class="edge" d="M660,180 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,250 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,310 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,360 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,408 H700" marker-end="url(#arrow)"/>

  <rect class="hl" x="700" y="156" width="340" height="62" rx="6"/>
  <text class="lbl" x="870" y="174" text-anchor="middle">Water Heating</text>
  <text class="sub" x="870" y="190" text-anchor="middle">heat-pump WH · solar · storage / tankless</text>
  <text class="sub" x="870" y="204" text-anchor="middle">electric / gas / oil</text>

  <rect class="svc" x="700" y="226" width="340" height="44" rx="6"/>
  <text class="lbl" x="870" y="244" text-anchor="middle">Lighting (base → LED)</text>
  <text class="sub" x="870" y="259" text-anchor="middle">+ low-flow hot-water fixtures</text>

  <rect class="svc" x="700" y="278" width="340" height="62" rx="6"/>
  <text class="lbl" x="870" y="296" text-anchor="middle">Major appliances</text>
  <text class="sub" x="870" y="312" text-anchor="middle">refrigerators · freezers · dryers · ranges ·</text>
  <text class="sub" x="870" y="326" text-anchor="middle">dishwashers · clothes washers · A/C</text>

  <rect class="svc" x="700" y="348" width="340" height="32" rx="6"/>
  <text class="lbl" x="870" y="368" text-anchor="middle">Minor appliances (electronics, etc.)</text>

  <text class="sub" x="870" y="405" text-anchor="middle">Space heat ≈60%, water heat ≈21% of residential energy.</text>
  <text class="sub" x="870" y="420" text-anchor="middle">No process emissions — all CO₂ from heating fuels.</text>

  <!-- legend -->
  <rect class="prod" x="40" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="62" y="570">dwelling stock (product)</text>
  <rect class="svc" x="240" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="262" y="570">end-use service</text>
  <rect class="hl" x="400" y="560" width="16" height="12" rx="2"/>
  <text class="sub" x="422" y="570">heat-pump-capable service</text>
</svg>
