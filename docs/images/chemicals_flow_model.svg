<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
    <marker id="darrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:12px;fill:#1f2a37;}
    .lblw{font-size:12px;fill:#fff;}
    .sub{font-size:10px;fill:#43506a;}
    .subw{font-size:10px;fill:#dfe7f2;}
    .li{font-size:9.5px;fill:#243042;}
    .ttl{font-size:11px;font-weight:bold;fill:#1f2a37;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .dedge{stroke:#8a9aa8;stroke-width:1.1;stroke-dasharray:4 3;fill:none;}
    .sector{fill:#33415c;}
    .branch{fill:#4b5d7e;}
    .prod{fill:#3d6ea5;}
    .det{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
    .spec{fill:#f3e7d3;stroke:#d6b483;stroke-width:1;}
    .svc{fill:#e4efe6;stroke:#aacbb0;stroke-width:1;}
  </style>

  <!-- sector -->
  <rect class="sector" x="440" y="12" width="200" height="46" rx="7"/>
  <text class="lblw" x="540" y="34" text-anchor="middle">Chemical Products sector</text>
  <text class="subw" x="540" y="49" text-anchor="middle">driver: product output (tonnes)</text>
  <path class="edge" d="M540,58 V72"/>
  <path class="edge" d="M300,72 H780"/>
  <path class="edge" d="M300,72 V84" marker-end="url(#arrow)"/>
  <path class="edge" d="M780,72 V84" marker-end="url(#arrow)"/>

  <!-- product / service branch -->
  <rect class="branch" x="222" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="300" y="103" text-anchor="middle">Product</text>
  <text class="subw" x="300" y="118" text-anchor="middle">chemical production chains</text>
  <rect class="branch" x="702" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="780" y="103" text-anchor="middle">Service</text>
  <text class="subw" x="780" y="118" text-anchor="middle">auxiliary energy services</text>

  <!-- product rail down left -->
  <path class="edge" d="M300,126 V140 H40 V632"/>
  <path class="edge" d="M40,168 H58" marker-end="url(#arrow)"/>
  <path class="edge" d="M40,278 H58" marker-end="url(#arrow)"/>
  <path class="edge" d="M40,388 H58" marker-end="url(#arrow)"/>
  <path class="edge" d="M40,478 H58" marker-end="url(#arrow)"/>
  <path class="edge" d="M40,558 H58" marker-end="url(#arrow)"/>

  <!-- Ammonia Methanol -->
  <rect class="prod" x="58" y="150" width="210" height="34" rx="6"/>
  <text class="lblw" x="163" y="171" text-anchor="middle">Ammonia &amp; Methanol</text>
  <rect class="det" x="58" y="188" width="430" height="76" rx="6"/>
  <text class="li" x="68" y="204">Ammonia Synthesis · Methanol Synthesis · Combined Synthesis</text>
  <text class="li" x="68" y="221">Reform &amp; synthesis (grey) · New AMV · Adv reforming reactors</text>
  <text class="li" x="68" y="238">Adv reforming reactors + CCS (blue)</text>
  <text class="li" x="68" y="255">Hydrogen ammonia synthesis (green / electrolytic)  — see Figure 2</text>

  <!-- Chlor-Alkali group -->
  <rect class="prod" x="58" y="268" width="210" height="34" rx="6"/>
  <text class="lblw" x="163" y="289" text-anchor="middle">Chlor-Alkali group</text>
  <rect class="det" x="58" y="306" width="430" height="66" rx="6"/>
  <text class="li" x="68" y="322">Chlorine Electrolysis — membrane · diaphragm · mercury cell</text>
  <text class="li" x="68" y="339">Caustic Sodium — caustic process · evaporation trains</text>
  <text class="li" x="68" y="356">(electricity-driven; emissions track the grid)</text>

  <!-- Sodium Chlorate + H2O2 -->
  <rect class="prod" x="58" y="376" width="210" height="34" rx="6"/>
  <text class="lblw" x="163" y="397" text-anchor="middle">Sodium Chlorate · H₂O₂</text>
  <rect class="det" x="58" y="414" width="430" height="56" rx="6"/>
  <text class="li" x="68" y="430">Sodium Chlorate — graphite / metal-anode cells · bipolar membrane</text>
  <text class="li" x="68" y="447">Hydrogen Peroxide — anthraquinone · methyl benzyl alcohol</text>
  <text class="li" x="68" y="461">(pulp-bleaching chemicals)</text>

  <!-- Adipic Acid -->
  <rect class="prod" x="58" y="474" width="210" height="34" rx="6"/>
  <text class="lblw" x="163" y="495" text-anchor="middle">Adipic Acid</text>
  <rect class="spec" x="278" y="474" width="210" height="34" rx="6"/>
  <text class="lbl" x="383" y="490" text-anchor="middle">Production · N₂O controls</text>
  <text class="sub" x="383" y="503" text-anchor="middle">N₂O process emission</text>

  <!-- Other Petrochemicals -->
  <rect class="prod" x="58" y="540" width="210" height="34" rx="6"/>
  <text class="lblw" x="163" y="561" text-anchor="middle">Other Petrochemicals</text>
  <rect class="det" x="58" y="578" width="430" height="80" rx="6"/>
  <text class="li" x="68" y="594">Pyrolysis (steam cracking) — product gas · new catalyst ·</text>
  <text class="li" x="78" y="609">+ CCS · bio-naphtha Fischer-Tropsch cracker</text>
  <text class="li" x="68" y="626">Petrochemicals — Intermediate Production · BTX Reforming ·</text>
  <text class="li" x="78" y="641">All Polymerization</text>

  <!-- service children rail -->
  <path class="edge" d="M780,126 V140 H640 V470"/>
  <path class="edge" d="M640,168 H720" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,228 H720" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,348 H720" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,408 H720" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,456 H720" marker-end="url(#arrow)"/>

  <rect class="spec" x="720" y="150" width="320" height="34" rx="6"/>
  <text class="lbl" x="880" y="171" text-anchor="middle">CCS  —  shared capture service</text>

  <rect class="svc" x="720" y="190" width="320" height="34" rx="6"/>
  <text class="lbl" x="880" y="211" text-anchor="middle">Machine Drive — EIA MECS end uses</text>
  <rect class="det" x="736" y="230" width="288" height="74" rx="6"/>
  <text class="li" x="750" y="249">• Materials Processing</text>
  <text class="li" x="750" y="267">• Compressed Air (synthesis)</text>
  <text class="li" x="750" y="285">• Fans · Materials Handling</text>
  <text class="li" x="900" y="249">• Pumps</text>

  <rect class="svc" x="720" y="330" width="320" height="36" rx="6"/>
  <text class="lbl" x="880" y="346" text-anchor="middle">Steam</text>
  <text class="sub" x="880" y="360" text-anchor="middle">NG · oil · electric · H₂ · CCS · cogen</text>

  <rect class="svc" x="720" y="390" width="320" height="36" rx="6"/>
  <text class="lbl" x="880" y="406" text-anchor="middle">Methane Blend</text>
  <text class="sub" x="880" y="420" text-anchor="middle">NG · biogas · biomass gas · H₂</text>

  <rect class="svc" x="720" y="438" width="320" height="30" rx="6"/>
  <text class="lbl" x="880" y="457" text-anchor="middle">HVAC · Lighting</text>

  <!-- service request arrow -->
  <path class="dedge" d="M488,300 C560,300 580,260 640,250" marker-end="url(#darrow)"/>
  <text class="sub" x="560" y="287" text-anchor="middle">service requests (GJ, t CO₂)</text>

  <!-- legend -->
  <rect class="prod" x="58" y="672" width="16" height="12" rx="2"/>
  <text class="sub" x="80" y="682">product chain</text>
  <rect class="det" x="200" y="672" width="16" height="12" rx="2"/>
  <text class="sub" x="222" y="682">process competition</text>
  <rect class="spec" x="372" y="672" width="16" height="12" rx="2"/>
  <text class="sub" x="394" y="682">process-emission / CCS</text>
  <rect class="svc" x="560" y="672" width="16" height="12" rx="2"/>
  <text class="sub" x="582" y="682">shared energy / utility service</text>
</svg>
