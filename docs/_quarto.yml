project:
  type: book
  output-dir: _book

bibliography: low_temp_heat.bib
link-citations: true

book:
  title: CIMS
  author: Brad Griffin, Jillian Anderson, and Matt Sniatynski
  repo-url: https://github.com/EMRG-SFU/cims
  repo-branch: quarto_docs
  repo-actions: [issue]
  chapters:
    - index.qmd
    - part: install
      chapters:
        - setup.qmd
        - getting_started.qmd
    - part: model
      chapters:
        - overview.qmd
        - technologies.qmd
        - sectors.qmd
        - low_temp_heat.qmd
    - part: results
      chapters:
        - policies.qmd
        - outputs.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: style.css
    link-external-newwindow: true
    include-after-body:
      - comma-fn.html
      - refs-backlinks.html
