project:
  type: book
  output-dir: _book

execute: 
  # freeze controls whether Quarto re-runs each document's code or reuses
  # cached results stored under _freeze/:
  #   false : always re-execute every code chunk on render (Quarto default)
  #   auto  : re-execute a document only when its source changes; otherwise
  #           reuse the frozen cache — fast for incremental local renders
  #   true  : never re-execute; always use the frozen cache (must already exist)
  # Day-to-day we use `auto` for speed. For a final, fully reproducible
  # render/publish, set this to false so every chapter executes fresh
  # rather than being served from cache.
  freeze: auto

# Bibliography: all chapters share ONE file, references.bib, but it is
# declared per-document in each citing chapter's YAML frontmatter rather
# than project-level here. This is deliberate: a project-level bibliography
# makes Quarto collect references book-wide, which floods every chapter's
# References section with the full list. Declaring the same file per-document
# scopes each chapter's References section to only the works it cites.
# references.qmd declares references.bib + nocite: @* to render the combined
# global References list (in HTML), and \printbibliographyORIG for PDF, where
# the per-chapter \printbibliography is no-op'd via header-includes below.
link-citations: true

# Project-wide filters. watermark.lua injects a DRAFT watermark when the
# `watermark` flag is set (via `quarto render --profile watermark`); it is a
# no-op otherwise. Runs for all formats (LaTeX/PDF and HTML).
# tech-block.lua indents and styles the sector chapters' technology blocks
# in PDF output (HTML styling is in style.css). theme-images.lua drops the
# dark version of light/dark image pairs (the flowcharts) outside HTML.
filters:
  - watermark.lua
  - tech-block.lua
  - theme-images.lua

book:
  title: CIMS
  favicon: images/cims-logo_favicon.svg
  # author: Energy and Materials Research Group, Simon Fraser University
  repo-url: https://github.com/EMRG-SFU/cims
  repo-branch: quarto_docs
  repo-actions: [issue]
  sidebar:
    collapse-level: 1
    # Logo comes from _brand.yml (light/dark pair). Don't set `logo:` here:
    # an explicit sidebar logo overrides the brand logo and collapses it
    # back to a single image, breaking the dark-mode swap.
  chapters:
    - index.qmd                 # Introduction
    - setup.qmd                 # Installation
    - part: "About"
      chapters:
        - history.qmd           # History and development
        - architecture.qmd      # Model architecture
    - part: "Methodology"
      chapters:
        - theory.qmd            # Theory
        - technologies.qmd      # Technology competition
        - energy-supply-demand.qmd  # Energy supply and demand
        - demand-feedbacks.qmd  # Goods and services demand feedbacks
        - sector_overview.qmd   # How a sector is modelled (shared structure of the sector chapters)
    # Sector chapters, grouped. Sub-sector chapters sit next to their parent
    # sector's chapter (for example sector_metal-smelting_aluminum.qmd).
    # Books allow only one level of parts, so the HTML sidebar nests the six
    # parts from here to General Services under a "Sector Descriptions"
    # heading with sidebar-sections.html (included below). Keep the part
    # titles there in step with these.
    - part: "Energy Supply"
      chapters:
        - sector_coal-mining.qmd              # Coal Mining
        - sector_natural-gas.qmd              # Natural Gas
        - sector_natural-gas_methane.qmd      #   Methane emissions in oil and gas
        - sector_petroleum-crude.qmd          # Petroleum Crude
        - sector_petroleum-crude_oil-sands.qmd #   Oil sands
        - sector_petroleum-refining.qmd       # Petroleum Refining
        - sector_electricity.qmd              # Electricity
        - sector_biofuels.qmd                 # Biofuels
        - sector_hydrogen.qmd                 # Hydrogen
    - part: "Industry"
      chapters:
        - sector_mining.qmd                   # Mining
        - sector_industrial-minerals.qmd      # Industrial Minerals
        - sector_chemicals.qmd                # Chemicals
        - sector_chemicals_nitrogen.qmd       #   Nitrogen chain
        - sector_chemicals_chlor-alkali.qmd   #   Chlor-alkali and oxidants
        - sector_chemicals_petrochemicals.qmd #   Petrochemicals and methanol
        - sector_pulp-and-paper.qmd           # Pulp and Paper
        - sector_metal-smelting.qmd           # Metal Smelting
        - sector_metal-smelting_aluminum.qmd  #   Aluminum
        - sector_metal-smelting_base-metals.qmd #   Base metals, magnesium, titanium slag
        - sector_iron-and-steel.qmd           # Iron and Steel
        - sector_light-industrial.qmd         # Light Industrial
        - sector_construction.qmd             # Construction
    - part: "Buildings"
      chapters:
        - sector_residential.qmd              # Residential
        - sector_commercial.qmd               # Commercial
    - part: "Transportation"
      chapters:
        - sector_transportation-passenger.qmd # Transportation Passenger
        - sector_transportation-freight.qmd   # Transportation Freight
    - part: "Land, Waste, and Removals"
      chapters:
        - sector_agriculture.qmd              # Agriculture
        - sector_forestry.qmd                 # Forestry
        - sector_waste.qmd                    # Waste
        - sector_direct-air-capture.qmd       # Direct air capture
        - sector_lulucf.qmd                   # LULUCF
    - part: "General Services"
      chapters:
        - machine-drive.qmd      # Machine drive systems in industry
        - industrial-heat.qmd    # Industrial heat and steam
        - cogeneration.qmd       # Cogeneration and on-site power
        - hvac-and-lighting.qmd  # HVAC and lighting in the industrial sectors
        - fuel-blends.qmd        # Fuel blend nodes
        - ccus.qmd               # Carbon capture, utilization, and storage
        - energy-storage.qmd     # Energy storage: thermal, short duration, long duration
    - part: "Running the Model"
      chapters:
        - data-inputs.qmd       # Data inputs
        - data-processing.qmd   # Data Processing
        - running-scenario.qmd  # How to run a scenario
        - building-tree.qmd     # Building the model tree
        - calibration.qmd       # Calibration
        - validation.qmd        # Validation
    - part: "Outputs and Analysis"
      chapters:
        - outputs.qmd           # Output files
        - post-processing.qmd   # Post-processing and reporting
        - policies.qmd          # Scenarios and policies
    - references.qmd
  appendices:
    - appendix_acronyms.qmd
    - appendix_file-formats.qmd
    - appendix_equations.qmd
    - appendix_figure-style.qmd
    - appendix_changelog.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: style.css
    link-external-newwindow: true
    include-after-body:
      - comma-fn.html
      - refs-backlinks.html
      - sidebar-sections.html
