project:
  type: book
  output-dir: _book

book:
  title: CIMS
  author: Brad Griffin, Jillian Anderson, and Matt Sniatynski
  # logo: altair-hist.png
  repo-url: https://github.com/EMRG-SFU/cims
  repo-branch: quarto_docs
  repo-actions: [issue]
  # sharing: [twitter, facebook]
  chapters:
    - index.qmd
    - part: install
      chapters:
        - setup.qmd
        - getting_started.qmd
    - part: model
      chapters:
        - overview.qmd
        - technologies.qmd
        - sectors.qmd
        - low_temp_heat.qmd
    - part: results
      chapters:
        - policies.qmd
        - outputs.qmd

format:
  html:
    theme: cosmo
    css: style.css
    link-external-newwindow: true
    include-after-body: 
      - comma-fn.html
      - refs-backlinks.html
