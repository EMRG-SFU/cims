[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CIMS"
requires-python = ">=3.11"
authors = [
    {name = "Jillian Anderson"},
    {name = "Bradford Griffin"},
    ]
description = "Economic Climate Modelling in Python"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
]
dependencies = [
    'networkx>=3.6.1',
    'numpy',
    'polars',
    'pyarrow',
    'pandas==2.3.3',
    'scipy',
    'seaborn>=0.13.2',
    'matplotlib',
    'wasabi',
    'tqdm',
    "packaging",
    "requests",
    'tabulate>=0.10',
    'psutil',
]
dynamic = ["version"]

[project.optional-dependencies]
# Install with e.g. `uv sync --extra notebooks --extra calibration`, or `uv sync --all-extras` for everything.
notebooks = ['marimo>=0.24.0']
# Needed only by CIMS.data_processing: reading the raw Excel sources, plus marimo because the
# pipeline settings live in a marimo notebook (data/mappings_conversions/control.py)
data-processing = [
    'CIMS[notebooks]',
    'openpyxl',
    'fastexcel',
    'xlrd',
]
# Needed only by CIMS.calibration: plots and the VizServer, plus marimo because some
# calibration modules are marimo notebooks
calibration = [
    'CIMS[notebooks]',
    'flask>=3.1.3',
    'plotly>=6.9.0',
    'kaleido',
]

[project.urls]
Repository = "https://github.com/EMRG-SFU/cims"


[tool.setuptools.packages.find]
where = ["src"]
include = ["CIMS*"]

[tool.setuptools.package-data]
"CIMS.calibration.VizServer" = ["static/*", "templates/*"]
"CIMS.data_processing.source.nrcan.ceud.residential.validation" = ["*.csv"]

[tool.setuptools.dynamic]
version = {attr = "CIMS.about.__version__"}


[tool.fawltydeps]
code = ["src/CIMS"]  # Only search for imports under ./src/CIMS (includes data_processing)
deps = ["pyproject.toml"]  # Only look for declared dependencies here
ignore_unused = ["xlrd", "fastexcel", "pyarrow", "kaleido"]  # Used by pandas, polars & plotly, but never imported directly
output_format = "human_detailed"  # Detailed report by default
