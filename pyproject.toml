[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CIMS"
requires-python = ">=3.11"
authors = [
    {name = "Jillian Anderson"},
    {name = "Bradford Griffin"},
    ]
description = "Economic Climate Modelling in Python"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
]
dependencies = [
    'networkx>=3.6.1',
    'numpy',
    'polars',
    'pyarrow',
    'pandas==2.3.3',
    'xlrd',
    'pyxlsb',
    'scipy',
    'seaborn>=0.13.2',
    'matplotlib',
    'wasabi',
    'tqdm',
    "packaging",
    "requests",
    'tabulate>=0.10',
    'psutil',
    ]
dynamic = ["version"]

[project.optional-dependencies]
notebooks = ['marimo>=0.24.0']

[project.urls]
Repository = "https://github.com/EMRG-SFU/cims"


[tool.setuptools.packages.find]
where = ["src"]
include = ["CIMS*"]

[tool.setuptools.dynamic]
version = {attr = "CIMS.about.__version__"}


[tool.fawltydeps]
code = ["src/CIMS"]  # Only search for imports under ./src/CIMS
deps = ["pyproject.toml"]  # Only look for declared dependencies here
ignore_unused = ["xlrd", "pyxlsb"]  # Pandas uses them, but they aren't imported
output_format = "human_detailed"  # Detailed report by default

# Resolve only versions that have a Windows wheel, since a new release sometimes ships without one
# (loro 1.19.0, a marimo dependency, did in November 2026).
[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
