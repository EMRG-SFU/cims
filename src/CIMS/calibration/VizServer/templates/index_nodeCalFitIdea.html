<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D3 Collapsible Tree with Fit Indicators</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 0;
    background: #fafafa;
  }

  /* SVG canvas */
  #tree-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  svg {
    width: 100%;
    height: 80vh;
  }

  /* Node styles */
  .node circle.node-dot {
    fill: #fff;
    stroke: #555;
    stroke-width: 2px;
    cursor: pointer;
  }

  .node text {
    font-size: 13px;
    fill: #333;
  }

  /* Link styles */
  .link {
    fill: none;
    stroke: #ccc;
    stroke-width: 1.5px;
  }

  /* Fit-indicator ring segments */
  .fit-arc {
    pointer-events: none;
    transition: opacity 0.2s;
  }

  /* Tooltip */
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(33, 33, 33, 0.92);
    color: #fff;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    z-index: 100;
    opacity: 0;
    transition: opacity 0.15s;
  }

  #tooltip .tt-node-name {
    font-weight: 600;
    margin-bottom: 4px;
  }

  #tooltip .tt-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #tooltip .tt-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* Legend */
  #legend {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    z-index: 50;
  }

  #legend h3 {
    margin: 0 0 8px 0;
    font-size: 13px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div>
<p>This was from a Lumo prompt on 2026-07-31 morning</P>
</div>
<div id="tree-container"></div>
<div id="tooltip"></div>

<div id="legend">
  <h3>Goodness of Fit</h3>
  <div class="legend-row">
    <span class="legend-swatch" style="background:hsl(15,90%,50%)"></span>
    Too high (more saturated = worse)
  </div>
  <div class="legend-row">
    <span class="legend-swatch" style="background:hsl(210,90%,50%)"></span>
    Too low (more saturated = worse)
  </div>
  <div class="legend-row">
    <span class="legend-swatch" style="background:hsl(140,45%,65%)"></span>
    Good fit (barely visible)
  </div>
  <div class="legend-row" style="margin-top:8px; color:#888; font-style:italic;">
    Arc length = magnitude of deviation<br>
    Absent types show no arc
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// Sample tree data
// Each node can have up to 3 info types.
// fit values: null = absent; number 0..1 where:
//   0   = perfect fit
//   0.5 = moderately off
//   1.0 = maximally wrong
// dir: -1 = too low, +1 = too high, 0 = good fit
// ─────────────────────────────────────────────
const data = {
  name: "Root",
  info: [
    { type: "A", fit: 0.05, dir: 0 },
    { type: "B", fit: 0.10, dir: 1 },
    { type: "C", fit: 0.02, dir: 0 }
  ],
  children: [
    {
      name: "Branch A",
      info: [
        { type: "A", fit: 0.80, dir: 1 },
        { type: "B", fit: null, dir: null },
        { type: "C", fit: 0.15, dir: 0 }
      ],
      children: [
        {
          name: "Leaf A1",
          info: [
            { type: "A", fit: 0.95, dir: 1 },
            { type: "B", fit: 0.85, dir: -1 },
            { type: "C", fit: 0.10, dir: 0 }
          ]
        },
        {
          name: "Leaf A2",
          info: [
            { type: "A", fit: 0.30, dir: -1 },
            { type: "B", fit: 0.05, dir: 0 },
            { type: "C", fit: null, dir: null }
          ]
        }
      ]
    },
    {
      name: "Branch B",
      info: [
        { type: "A", fit: 0.40, dir: -1 },
        { type: "B", fit: 0.92, dir: 1 },
        { type: "C", fit: 0.03, dir: 0 }
      ],
      children: [
        {
          name: "Leaf B1",
          info: [
            { type: "A", fit: null, dir: null },
            { type: "B", fit: 0.70, dir: 1 },
            { type: "C", fit: 0.88, dir: -1 }
          ]
        },
        {
          name: "Leaf B2",
          info: [
            { type: "A", fit: 0.08, dir: 0 },
            { type: "B", fit: 0.12, dir: 0 },
            { type: "C", fit: 0.04, dir: 0 }
          ]
        }
      ]
    },
    {
      name: "Branch C",
      info: [
        { type: "A", fit: 0.55, dir: -1 },
        { type: "B", fit: 0.45, dir: 1 },
        { type: "C", fit: 0.60, dir: -1 }
      ]
    }
  ]
};

// ─────────────────────────────────────────────
// Configuration
// ─────────────────────────────────────────────
const NODE_RADIUS    = 7;
const ARC_INNER_R   = NODE_RADIUS + 1.5;
const ARC_OUTER_R   = NODE_RADIUS + 5;
const ARC_GAP        = 0.08;   // radians between arcs
const TYPE_COLORS = {
  "-1": (severity) => `hsl(210, ${Math.min(30 + severity * 60, 95)}%, ${Math.max(60 - severity * 18, 35)}%)`,
  "0":  (severity) => `hsl(140, ${Math.max(50 - severity * 50, 20)}%, ${Math.min(65 + severity * 15, 80)}%)`,
  "1":  (severity) => `hsl(15,  ${Math.min(30 + severity * 60, 95)}%, ${Math.max(60 - severity * 18, 35)}%)`
};
const TYPE_LABELS = ["A", "B", "C"];
const MAX_ARC_SPAN = (2 * Math.PI - ARC_GAP * 3) / 3; // each type gets ~1/3

// ─────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────
/**
 * Convert fit/deviation data into arc path parameters.
 * Returns array of { startAngle, endAngle, color } or empty array if not present.
 */
function buildArcs(infoArr) {
  if (!infoArr || !infoArr.length) return [];

  const arcs = [];
  const slotAngle = (2 * Math.PI) / infoArr.length;

  infoArr.forEach((info, i) => {
    if (info.fit === null) return;

    const severity = Math.min(info.fit, 1);   // 0..1
    const dir = info.dir;                       // -1, 0, +1

    // Baseline tiny arc so "good fit" is still faintly visible
    const baseArc   = 0.12;
    const arcLength = baseArc + severity * (slotAngle - ARC_GAP - baseArc);

    const startAngle = i * slotAngle + ARC_GAP / 2;
    const endAngle   = startAngle + arcLength;

    arcs.push({
      startAngle,
      endAngle,
      color: TYPE_COLORS[String(dir)](severity),
      typeIndex: i,
      info
    });
  });

  return arcs;
}

// ─────────────────────────────────────────────
// Build the tree
// ─────────────────────────────────────────────
const margin = { top: 110, right: 120, bottom: 30, left: 100 };
const width  = 960 - margin.left - margin.right;
const height = 600 - margin.top - margin.bottom;

const svg = d3.select("#tree-container").append("svg")
  .attr("viewBox", [-margin.left, -margin.top, width + margin.left + margin.right, height + margin.top + margin.bottom]);

const gLink = svg.append("g").attr("class", "links");
const gNode = svg.append("g").attr("class", "nodes");

const root = d3.hierarchy(data);
root.x0 = 0;
root.y0 = 0;
root.descendants().forEach((d, i) => { d.id = i; d._children = d.children; });

// Collapse all children initially except root's first level
if (root.children) {
  root.children.forEach(collapse);
}

function collapse(d) {
  if (d.children) {
    d._children = d.children;
    d._children.forEach(collapse);
    d.children = null;
  }
}

const treeLayout = d3.tree().nodeSize([28, 200]);

// Tooltip
const tooltip = d3.select("#tooltip");

// ─────────────────────────────────────────────
// Update / render function
// ─────────────────────────────────────────────
let nodeIdCounter = 0;

function update(source) {
  treeLayout(root);

  const nodes = root.descendants();
  const links = root.links();

  // ---- LINKS ----
  const link = gLink.selectAll("path.link")
    .data(links, d => d.target.id);

  link.exit().transition().duration(400)
    .attr("d", () => {
      const o = { x: source.x0, y: source.y0 };
      return diagonal({ source: o, target: o });
    })
    .remove();

  link.enter().append("path")
    .attr("class", "link")
    .attr("d", () => {
      const o = { x: source.x0, y: source.y0 };
      return diagonal({ source: o, target: o });
    })
    .merge(link)
    .transition().duration(500)
    .attr("d", diagonal);

  // ---- NODES ----
  const node = gNode.selectAll("g.node")
    .data(nodes, d => d.id);

  const nodeEnter = node.enter().append("g")
    .attr("class", "node")
    .attr("transform", `translate(${source.y0},${source.x0})`)
    .style("cursor", "pointer")
    .on("click", (event, d) => {
      if (d.children) {
        d._children = d.children;
        d.children = null;
      } else if (d._children) {
        d.children = d._children;
        d._children = null;
      }
      update(d);
    })
    .on("mouseenter", (event, d) => {
      showTooltip(event, d);
    })
    .on("mouseleave", () => {
      tooltip.style("opacity", 0);
    })
    .on("mousemove", (event) => {
      tooltip
        .style("left", (event.pageX + 14) + "px")
        .style("top",  (event.pageY - 10) + "px");
    });

  // Main node circle
  nodeEnter.append("circle")
    .attr("class", "node-dot")
    .attr("r", NODE_RADIUS);

  // Fit indicator group (arcs added in the merge step)
  nodeEnter.append("g").attr("class", "fit-group");

  // Node label
  nodeEnter.append("text")
    .attr("dy", "0.35em")
    .attr("x", d => d._children ? -ARC_OUTER_R - 6 : ARC_OUTER_R + 6)
    .attr("text-anchor", d => d._children ? "end" : "start")
    .text(d => d.data.name);

  // Merge enter + update
  const nodeUpdate = nodeEnter.merge(node);

  nodeUpdate.transition().duration(500)
    .attr("transform", d => `translate(${d.y},${d.x})`);

  // Re-draw fit arcs
  nodeUpdate.each(function(d) {
    const arcs = buildArcs(d.data.info);
    const arcGen = d3.arc()
      .innerRadius(ARC_INNER_R)
      .outerRadius(ARC_OUTER_R);

    const sel = d3.select(this).select(".fit-group")
      .selectAll("path.fit-arc")
      .data(arcs);

    sel.exit().remove();

    sel.enter().append("path")
        .attr("class", "fit-arc")
      .merge(sel)
        .attr("d", arcGen)
        .attr("fill", a => a.color)
        .attr("opacity", a => {
          // Dim arcs that are near-zero severity
          if (a.info.fit !== null && a.info.dir === 0 && a.info.fit < 0.15) {
            return 0.35;
          }
          return 0.92;
        });
  });

  // Remove exiting nodes
  const nodeExit = node.exit().transition().duration(400)
    .attr("transform", `translate(${source.y},${source.x})`)
    .remove();

  // Store old positions for transitions
  root.eachBefore(d => {
    d.x0 = d.x;
    d.y0 = d.y;
  });
}

// ─────────────────────────────────────────────
// Diagonal generator (horizontal tree)
// ─────────────────────────────────────────────
function diagonal({ source, target }) {
  return `M${source.y},${source.x}
          C${(source.y + target.y) / 2},${source.x}
           ${(source.y + target.y) / 2},${target.x}
           ${target.y},${target.x}`;
}

// ─────────────────────────────────────────────
// Tooltip builder
// ─────────────────────────────────────────────
function showTooltip(event, d) {
  let html = `<div class="tt-node-name">${d.data.name}</div>`;

  if (!d.data.info || d.data.info.length === 0) {
    html += `<div style="color:#999;">No info types</div>`;
  } else {
    d.data.info.forEach((info, i) => {
      if (info.fit === null) {
        html += `<div class="tt-row"><span class="tt-swatch" style="background:#ccc;"></span>Type ${TYPE_LABELS[i]}: —</div>`;
      } else {
        const dirLabel = info.dir === 1 ? "Too high" : info.dir === -1 ? "Too low" : "Good fit";
        const swatch  = TYPE_COLORS[String(info.dir)](info.fit);
        html += `<div class="tt-row"><span class="tt-swatch" style="background:${swatch};"></span>Type ${TYPE_LABELS[i]}: ${dirLabel} (${(info.fit * 100).toFixed(0)}%)</div>`;
      }
    });
  }

  tooltip.html(html).style("opacity", 1)
    .style("left", (event.pageX + 14) + "px")
    .style("top",  (event.pageY - 10) + "px");
}

// ─────────────────────────────────────────────
// Initialize
// ─────────────────────────────────────────────
update(root);
</script>
</body>
</html>
