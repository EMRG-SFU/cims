
<table>
    <thead>
    <tr>
    <th colspan="42" class="tableNodeName">{{context['nodeName']}}</th>
    </tr> 
    <tr>
        {% for th in context['colNames'] %}
            <th>{{th}}</th>
        {% endfor %}

    </tr>
    </thead>
    <tbody>

    {% for rr in context['rows'] %}
        <tr>
            {% for val in rr %}
                <td>{{val}}</td>
            {% endfor %}

        </tr>
    {% endfor %}

    </tbody>
</table>
