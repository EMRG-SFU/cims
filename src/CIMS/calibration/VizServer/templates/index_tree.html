<!doctype html>
<html>
<head>
<style>
/* HTML styles */
html{ width: 100%; }

body{ 
  width: 100%;
  margin: 0;
  padding: 0;
  font-family: sans-serif;
  font-size: 75%;
}

/* SVG styles */
svg {
  min-width: 200px;
  min-height: 500px;
}
.links line {
  stroke: #aaa;
}
.nodes circle {
  pointer-events: all;
}

#controlsContainer{
    position:fixed;
    top: 1%;
    width: fit-content;
    z-index:1;
}

#svgContainer {
    height: 60%;
    position:absolute;
    /*overflow:scroll;*/
    z-index:0;
    /*border: 2px solid blue;*/
}

#mainSVG {
    border: 1px dashed grey;
}

#nodeInfo {
    overflow:scroll;
    /*background-color:white;*/
    opacity:0.97;
    position:fixed;
    max-height: 55%;
    max-width: 90%;
    bottom: 5%;
    width:fit-content;
    z-index:1;
}

#calibrationPlots {
    overflow:scroll;
    opacity:1.0;
    position:fixed;
    max-height:100%;
    bottom:5%;
    right:5%;
    z-index:1;
}

table :is(td, th) {
  border: 1px solid black;
  padding: 0.3em;

}

table :is(th) {
  border-bottom: 5px double black;
  padding: 0.3em;

}

table {
  opacity:1.0;
  border-collapse: collapse;
  background-color: white;
  margin: 20px;
  border: 6px solid black;
}
tr:nth-child(even) {
  background-color: #f8ebff;
}
tr:nth-child(odd) {
  background-color: white;
}


.button {
  border: none;
  color: white;
  padding: 8px 16px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  transition-duration: 0.4s;
  cursor: pointer;
}

.button1 {
  background-color: white;
  color: black;
  border: 2px solid black;
}

.button1:hover {
  background-color: gray;
  color: white;
}

/* Dropdown Button */
.dropbtn {
  background-color: #04AA6D;
  color: white;
  padding: 16px;
  font-size: 16px;
  border: none;
  cursor: pointer;
}

/* Dropdown button on hover & focus */
.dropbtn:hover, .dropbtn:focus {
  background-color: #3e8e41;
}

/* The search field */
#dropdownInput {
  box-sizing: border-box;
  background-image: url('searchicon.png');
  background-position: 14px 12px;
  background-repeat: no-repeat;
  font-size: 16px;
  padding: 14px 20px 12px 45px;
  border: none;
  border-bottom: 1px solid #ddd;
}

/* The search field when it gets focus/clicked on */
#dropdownInput:focus {outline: 3px solid #ddd;}

/* The container <div> - needed to position the dropdown content */
.dropdown {
  position: relative;
  display: inline-block;
}

/* Dropdown Content (Hidden by Default) */
.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f6f6f6;
  min-width: 230px;
  max-height: 700px;
  overflow: scroll;
  border: 1px solid #ddd;
  z-index: 1;
}

.dropdown-content-2 {
    display: none;
    position: absolute;
    /*min-height: 2.5rem;*/
    /*height: auto;*/
    /*max-height: 90vh;*/
    z-index: 1;
}

/* Links inside the dropdown */
.dropdown-content span {
  color: black;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  cursor: pointer;
}

/* Change color of dropdown links on hover */
.dropdown-content span:hover {background-color: #f1f1f1}

/* Show the dropdown menu (use JS to add this class to the .dropdown-content container when the user clicks on the dropdown button) */
.show {display:block;}

#rootNodeAddress {
    width:600px;
}

.paramSelector {
    width: 100%;             /* fill the wrapper */
    min-height: 2.5rem;      /* a sensible starting height */
    height: auto;            /* let it grow */
    max-height: 90vh;        /* stop at 90% of viewport height */
    overflow-y: auto;        /* scroll when max-height is reached */
    font-size: 1rem;
    line-height: 1.5;
    padding: 0.3rem;
    border: 1px solid #aaa;
    border-radius: 4px;
    background: white;
}

</style>
</head>
<body>

<div id="controlsContainer">
<div class="dropdown" style="display:none;">
    <button onclick="toggleDropdown()" class="button button1">CIMS Nodes</button>
    <div id="myDropdown" class="dropdown-content">
        <input type="text" placeholder="Type to Filter..." id="dropdownInput" onkeyup="filterFunction()">
    </div>
</div>


<div class="dropdown" style="display:none;">
    <button onclick="toggleNodeParams()" class="button button1">Node Params</button>
    <div id="myDropdown_nodeParams" class="dropdown-content-2">
        <input type="text" placeholder="Type to Filter..." id="dropdownInput_nodeParams" onkeyup="filterFunction_nodeParams()">
        <select id="selectNodeParams" class="paramSelector" multiple></select>
    </div>
</div>

<div class="dropdown" style="display:none;">
    <button onclick="toggleTechParams()" class="button button1">Tech Params</button>
    <div id="myDropdown_techParams" class="dropdown-content-2">
        <input type="text" placeholder="Type to Filter..." id="dropdownInput_techParams" onkeyup="filterFunction_techParams()">
        <select id="selectTechParams" class="paramSelector" multiple></select>
    </div>
</div>

<div style="display:none;">
<input type="checkbox" id="reqProvLinkCheck" onchange="update(null, root)">reqProvLinks</input>
<input type="checkbox" id="missingLinkCheck" onchange="update(null, root)">missingLinks</input>
<input type="checkbox" id="nodeSelMode" onchange="update(null, root)">NodeSelectionMode</input>
</div>

<button class="button button1" onclick="foldAll()">Fold All</button>
<button class="button button1" onclick="unfoldAll()">Unfold All</button>
<button class="button button1" onclick="resetZoom()">Reset Zoom</button>
<br/>
<input type="text" list="nodeSuggestions" id="rootNodeAddress" onkeydown="handleAddressKeydown(event, this)">
<datalist id="nodeSuggestions"></datalist>
</div>
<div id="svgContainer">
<svg id="mainSVG"></svg>
</div>

<div id="nodeInfo"></div>
<div id="calibrationPlots"></div>

<script>
    const SERVER_BASE_URL = "{{ base_url }}";
</script>
<script src="{{ url_for('static', filename='d3.v7.js') }}"></script>
<script src="{{ url_for('static', filename='graphViz_tree.js') }}" type="module"></script>
</body>
</html>
