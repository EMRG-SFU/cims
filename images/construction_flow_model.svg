<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
    <marker id="farrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <style>
    .lblw{font-size:12px;fill:#fff;}
    .subw{font-size:10px;fill:#dfe7f2;}
    .lbl{font-size:12px;fill:#1f2a37;}
    .sub{font-size:10px;fill:#43506a;}
    .li{font-size:9.5px;fill:#243042;}
    .ttl{font-size:11px;font-weight:bold;fill:#1f2a37;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .dedge{stroke:#8a9aa8;stroke-width:1.1;stroke-dasharray:4 3;fill:none;}
    .sector{fill:#33415c;}
    .svc{fill:#3d6ea5;}
    .diesel{fill:#f3e7d3;stroke:#d6b483;stroke-width:1;}
    .elec{fill:#cfe3d6;stroke:#3f7d52;stroke-width:1;}
    .det{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
    .fuel{fill:#eef2f7;stroke:#9db8d8;stroke-width:1;}
  </style>

  <!-- sector -->
  <rect class="sector" x="280" y="14" width="260" height="48" rx="7"/>
  <text class="lblw" x="410" y="35" text-anchor="middle">Construction sector</text>
  <text class="subw" x="410" y="51" text-anchor="middle">driver: exogenous activity (t CO₂e)</text>
  <path class="edge" d="M410,62 V90" marker-end="url(#arrow)"/>

  <!-- transport service -->
  <rect class="svc" x="300" y="90" width="220" height="44" rx="6"/>
  <text class="lblw" x="410" y="110" text-anchor="middle">Transport service</text>
  <text class="subw" x="410" y="125" text-anchor="middle">tech-compete: mobile equipment</text>

  <!-- two competing techs -->
  <path class="edge" d="M410,134 V152 H210 V172" marker-end="url(#arrow)"/>
  <path class="edge" d="M410,134 V152 H610 V172" marker-end="url(#arrow)"/>

  <rect class="diesel" x="70" y="172" width="280" height="70" rx="6"/>
  <text class="ttl" x="85" y="192" style="fill:#9a6a1f">Diesel equipment</text>
  <text class="li" x="85" y="210">entire base-year fleet (excavators, loaders,</text>
  <text class="li" x="85" y="225">dozers, cranes, dump trucks, compactors)</text>

  <rect class="elec" x="470" y="172" width="280" height="70" rx="6"/>
  <text class="ttl" x="485" y="192" style="fill:#2c6e49">Electric equipment</text>
  <text class="li" x="485" y="210">commercial in compact machines;</text>
  <text class="li" x="485" y="225">emerging in larger ones</text>

  <!-- fuel requests -->
  <path class="edge" d="M210,242 V266" marker-end="url(#arrow)"/>
  <rect class="fuel" x="70" y="266" width="280" height="34" rx="6"/>
  <text class="lbl" x="210" y="287" text-anchor="middle">→ diesel fuel blend  (emits CO₂)</text>

  <path class="edge" d="M610,242 V266" marker-end="url(#arrow)"/>
  <rect class="fuel" x="470" y="266" width="280" height="34" rx="6"/>
  <text class="lbl" x="610" y="287" text-anchor="middle">→ grid electricity  (no tailpipe CO₂)</text>

  <!-- future options -->
  <rect class="det" x="70" y="330" width="680" height="56" rx="6" stroke-dasharray="5 3"/>
  <text class="ttl" x="85" y="350">Future options — not yet in model (TODO)</text>
  <text class="li" x="85" y="368">Renewable diesel / biodiesel as a drop-in fuel switch, and hydrogen fuel-cell equipment</text>
  <text class="li" x="85" y="381">for the heaviest, longest-running machines, would join the competition at the Transport node.</text>
</svg>
