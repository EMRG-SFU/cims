<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
    <marker id="darrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:12px;fill:#1f2a37;}
    .lblw{font-size:12px;fill:#fff;}
    .sub{font-size:10px;fill:#43506a;}
    .subw{font-size:10px;fill:#dfe7f2;}
    .li{font-size:9.5px;fill:#243042;}
    .ttl{font-size:11px;font-weight:bold;fill:#1f2a37;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .dedge{stroke:#8a9aa8;stroke-width:1.1;stroke-dasharray:4 3;fill:none;}
    .sector{fill:#33415c;}
    .branch{fill:#4b5d7e;}
    .prod{fill:#3d6ea5;}
    .det{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
    .spec{fill:#f3e7d3;stroke:#d6b483;stroke-width:1;}
    .svc{fill:#e4efe6;stroke:#aacbb0;stroke-width:1;}
  </style>

  <!-- sector -->
  <rect class="sector" x="430" y="12" width="220" height="46" rx="7"/>
  <text class="lblw" x="540" y="34" text-anchor="middle">Metal Smelting and Refining</text>
  <text class="subw" x="540" y="49" text-anchor="middle">driver: refined metal output (tonnes)</text>
  <path class="edge" d="M540,58 V72"/>
  <path class="edge" d="M300,72 H780"/>
  <path class="edge" d="M300,72 V84" marker-end="url(#arrow)"/>
  <path class="edge" d="M780,72 V84" marker-end="url(#arrow)"/>

  <!-- product / service branch -->
  <rect class="branch" x="222" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="300" y="103" text-anchor="middle">Product</text>
  <text class="subw" x="300" y="118" text-anchor="middle">per-metal chains</text>
  <rect class="branch" x="702" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="780" y="103" text-anchor="middle">Service</text>
  <text class="subw" x="780" y="118" text-anchor="middle">oxygen, machine drive, steam</text>

  <!-- product rail -->
  <path class="edge" d="M300,126 V140 H40 V470"/>
  <path class="edge" d="M40,170 H58" marker-end="url(#arrow)"/>
  <path class="edge" d="M40,340 H58" marker-end="url(#arrow)"/>

  <!-- Aluminium -->
  <rect class="prod" x="58" y="150" width="210" height="34" rx="6"/>
  <text class="lblw" x="163" y="171" text-anchor="middle">Aluminium (dominant)</text>
  <rect class="det" x="58" y="188" width="440" height="138" rx="6"/>
  <text class="ttl" x="68" y="205">Primary Aluminum</text>
  <text class="li" x="68" y="221">Alumina — Bayer process (NG)</text>
  <text class="li" x="68" y="237">Electrolysis (Hall-Héroult):</text>
  <text class="li" x="78" y="251">Søderberg · pre-bake anode (point feeders)</text>
  <text class="li" x="78" y="265" style="fill:#2c6e49">inert anode + wetted cathode → emits O₂, no carbon CO₂</text>
  <text class="ttl" x="68" y="285">Recycle — remelt scrap (~5% of primary energy)</text>
  <text class="li" x="68" y="301">Anode supply: Pre-bake · Søderberg</text>
  <text class="li" x="68" y="317" style="fill:#9a6a1f">carbon-anode process CO₂ ≈ 1.6–1.7 / t Al  (+ PFCs)</text>

  <!-- Base metals -->
  <rect class="prod" x="58" y="330" width="210" height="34" rx="6"/>
  <text class="lblw" x="163" y="351" text-anchor="middle">Cu · Ni · Zn · Mg (· Pb · Ti)</text>
  <rect class="det" x="58" y="368" width="440" height="104" rx="6"/>
  <text class="li" x="68" y="385">Metallurgy:</text>
  <text class="li" x="78" y="400">Pyro — roast → smelt (flash/EAF/reverb) → convert → refine</text>
  <text class="li" x="88" y="414">(oxygen-enriched · continuous / Mitsubishi smelting)</text>
  <text class="li" x="78" y="429">Hydro — leach · solvent extraction · electrowinning</text>
  <text class="li" x="68" y="446">Melt Cast → finished metal</text>
  <text class="li" x="68" y="462" style="fill:#9a6a1f">magnesium SF₆ cover gas (very high GWP)</text>

  <!-- service rail -->
  <path class="edge" d="M780,126 V140 H640 V410"/>
  <path class="edge" d="M640,176 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,250 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,300 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,350 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,398 H700" marker-end="url(#arrow)"/>

  <rect class="spec" x="700" y="150" width="340" height="48" rx="6"/>
  <text class="lbl" x="870" y="167" text-anchor="middle">Oxygen</text>
  <text class="sub" x="870" y="182" text-anchor="middle">cryogenic air separation</text>
  <text class="sub" x="870" y="194" text-anchor="middle">(oxygen-enriched smelting / converting)</text>

  <rect class="svc" x="700" y="226" width="340" height="34" rx="6"/>
  <text class="lbl" x="870" y="247" text-anchor="middle">Machine Drive — EIA MECS end uses</text>

  <rect class="svc" x="700" y="284" width="340" height="32" rx="6"/>
  <text class="lbl" x="870" y="304" text-anchor="middle">Steam</text>

  <rect class="svc" x="700" y="334" width="340" height="32" rx="6"/>
  <text class="lbl" x="870" y="354" text-anchor="middle">Methane Blend</text>

  <rect class="svc" x="700" y="384" width="340" height="30" rx="6"/>
  <text class="lbl" x="870" y="403" text-anchor="middle">HVAC · Lighting</text>

  <text class="sub" x="870" y="440" text-anchor="middle">No CCS service in current tree (see TODO)</text>

  <!-- service request arrow -->
  <path class="dedge" d="M498,250 C560,250 580,200 640,185" marker-end="url(#darrow)"/>
  <text class="sub" x="560" y="237" text-anchor="middle">service requests (GJ, t O₂)</text>

  <!-- legend -->
  <rect class="prod" x="58" y="500" width="16" height="12" rx="2"/>
  <text class="sub" x="80" y="510">metal chain</text>
  <rect class="det" x="190" y="500" width="16" height="12" rx="2"/>
  <text class="sub" x="212" y="510">process competition</text>
  <rect class="spec" x="360" y="500" width="16" height="12" rx="2"/>
  <text class="sub" x="382" y="510">oxygen / process-emission note</text>
  <rect class="svc" x="600" y="500" width="16" height="12" rx="2"/>
  <text class="sub" x="622" y="510">shared energy / utility service</text>
</svg>
