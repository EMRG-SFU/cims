<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
    <marker id="darrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:12px;fill:#1f2a37;}
    .lblw{font-size:12px;fill:#fff;}
    .sub{font-size:10px;fill:#43506a;}
    .subw{font-size:10px;fill:#dfe7f2;}
    .li{font-size:10px;fill:#243042;}
    .ttl{font-size:11.5px;font-weight:bold;fill:#1f2a37;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .dedge{stroke:#8a9aa8;stroke-width:1.1;stroke-dasharray:4 3;fill:none;}
    .sector{fill:#33415c;}
    .branch{fill:#4b5d7e;}
    .prod{fill:#3d6ea5;}
    .det{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
    .gray{fill:#eef1f5;stroke:#c3ccd8;stroke-width:1;}
    .svc{fill:#e4efe6;stroke:#aacbb0;stroke-width:1;}
    .spec{fill:#f3e7d3;stroke:#d6b483;stroke-width:1;}
    .dash{stroke-dasharray:5 4;}
  </style>

  <!-- sector -->
  <rect class="sector" x="440" y="12" width="200" height="46" rx="7"/>
  <text class="lblw" x="540" y="34" text-anchor="middle">Iron and Steel sector</text>
  <text class="subw" x="540" y="49" text-anchor="middle">driver: crude steel output (tonnes)</text>
  <path class="edge" d="M540,58 V72"/>
  <path class="edge" d="M300,72 H770"/>
  <path class="edge" d="M300,72 V84" marker-end="url(#arrow)"/>
  <path class="edge" d="M770,72 V84" marker-end="url(#arrow)"/>

  <!-- product / service branch -->
  <rect class="branch" x="222" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="300" y="103" text-anchor="middle">Product</text>
  <text class="subw" x="300" y="118" text-anchor="middle">physical production chain</text>
  <rect class="branch" x="692" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="770" y="103" text-anchor="middle">Service</text>
  <text class="subw" x="770" y="118" text-anchor="middle">auxiliary energy services</text>

  <!-- product children rail -->
  <path class="edge" d="M300,126 V140"/>
  <path class="edge" d="M110,140 H470"/>
  <path class="edge" d="M110,140 V150" marker-end="url(#arrow)"/>
  <path class="edge" d="M300,140 V150" marker-end="url(#arrow)"/>
  <path class="edge" d="M470,140 V150" marker-end="url(#arrow)"/>

  <!-- Molten Steel -->
  <rect class="prod" x="40" y="150" width="150" height="40" rx="6"/>
  <text class="lblw" x="115" y="168" text-anchor="middle">Molten Steel</text>
  <text class="subw" x="115" y="183" text-anchor="middle">see Figure 2</text>
  <rect class="det" x="40" y="200" width="150" height="74" rx="6"/>
  <text class="li" x="48" y="217">Integrated route</text>
  <text class="li" x="48" y="232">Recycled route (EAF)</text>
  <text class="li" x="48" y="247">Ladle Refining</text>
  <text class="li" x="48" y="262">Ladle Preheat</text>

  <!-- Continuous Cast -->
  <rect class="prod" x="226" y="150" width="148" height="40" rx="6"/>
  <text class="lblw" x="300" y="173" text-anchor="middle">Continuous Cast</text>
  <path class="edge" d="M300,190 V200" marker-end="url(#arrow)"/>
  <rect class="det" x="206" y="200" width="188" height="170" rx="6"/>
  <text class="ttl" x="214" y="217">Slabs</text>
  <text class="li" x="214" y="231">Casting (cont., thin-slab, strip,</text>
  <text class="li" x="224" y="243">ingot)</text>
  <text class="li" x="214" y="257">Roughing &amp; Finishing mills</text>
  <text class="li" x="214" y="271">Pickling · Skin Pass</text>
  <text class="li" x="214" y="285">Cold Rolled — cold roll, clean,</text>
  <text class="li" x="224" y="297">anneal/temper, tin, galvanize</text>
  <text class="ttl" x="214" y="318">Blooms</text>
  <text class="li" x="214" y="332">Casting · heavy shapes · tubes</text>
  <text class="ttl" x="214" y="353">Billets</text>
  <text class="li" x="214" y="367">Casting · bar · rod · light shapes</text>

  <!-- Foundry -->
  <rect class="prod dash" x="410" y="150" width="120" height="40" rx="6"/>
  <text class="lblw" x="470" y="168" text-anchor="middle">Foundry</text>
  <text class="subw" x="470" y="183" text-anchor="middle">design; no data</text>

  <!-- service children rail -->
  <path class="edge" d="M770,126 V140 H612 V612"/>
  <path class="edge" d="M612,168 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M612,216 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M612,300 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M612,420 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M612,468 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M612,516 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M612,564 H700" marker-end="url(#arrow)"/>
  <path class="edge" d="M612,608 H700" marker-end="url(#arrow)"/>

  <!-- sector-specific services -->
  <rect class="spec" x="700" y="150" width="340" height="36" rx="6"/>
  <text class="lbl" x="870" y="166" text-anchor="middle">Agglomeration</text>
  <text class="sub" x="870" y="180" text-anchor="middle">iron sinter · sinter + CCS</text>

  <rect class="spec" x="700" y="198" width="340" height="36" rx="6"/>
  <text class="lbl" x="870" y="214" text-anchor="middle">Oxygen</text>
  <text class="sub" x="870" y="228" text-anchor="middle">cryogenic air separation</text>

  <rect class="spec" x="700" y="246" width="340" height="48" rx="6"/>
  <text class="lbl" x="870" y="263" text-anchor="middle">Iron Process Gas</text>
  <text class="sub" x="870" y="278" text-anchor="middle">on-site off-gas → Reheating &amp; Steam</text>
  <text class="sub" x="870" y="290" text-anchor="middle">(boiler · cogeneration)</text>

  <rect class="spec" x="700" y="306" width="340" height="34" rx="6"/>
  <text class="lbl" x="870" y="327" text-anchor="middle">CCS  —  90% capture service</text>

  <!-- machine drive -->
  <rect class="svc" x="700" y="352" width="340" height="34" rx="6"/>
  <text class="lbl" x="870" y="373" text-anchor="middle">Machine Drive — EIA MECS end uses</text>
  <rect class="det" x="716" y="392" width="308" height="74" rx="6"/>
  <text class="li" x="730" y="411">• Materials Processing (mill drives)</text>
  <text class="li" x="730" y="429">• Fans &amp; blowers</text>
  <text class="li" x="730" y="447">• Materials Handling</text>
  <text class="li" x="884" y="411">• Pumps</text>
  <text class="li" x="884" y="429">• Compressed Air</text>

  <!-- reheating -->
  <rect class="svc" x="700" y="450" width="340" height="36" rx="6"/>
  <text class="lbl" x="870" y="466" text-anchor="middle">Reheating</text>
  <text class="sub" x="870" y="480" text-anchor="middle">NG/oil · recuperated · induction · electric</text>

  <rect class="svc" x="700" y="498" width="340" height="36" rx="6"/>
  <text class="lbl" x="870" y="514" text-anchor="middle">Steam</text>
  <text class="sub" x="870" y="528" text-anchor="middle">NG · coal · oil · electric · H₂ · CCS · cogen</text>

  <rect class="svc" x="700" y="546" width="340" height="36" rx="6"/>
  <text class="lbl" x="870" y="562" text-anchor="middle">Methane Blend</text>
  <text class="sub" x="870" y="576" text-anchor="middle">NG · biogas · biomass gas · H₂</text>

  <rect class="svc" x="700" y="594" width="340" height="30" rx="6"/>
  <text class="lbl" x="870" y="613" text-anchor="middle">HVAC · Lighting</text>

  <!-- service-request arrow -->
  <path class="dedge" d="M394,300 C500,300 510,300 612,300" marker-end="url(#darrow)"/>
  <text class="sub" x="500" y="293" text-anchor="middle">service requests (GJ, t O₂, t CO₂)</text>

  <!-- legend -->
  <rect class="prod" x="40" y="660" width="16" height="12" rx="2"/>
  <text class="sub" x="62" y="670">product / production stage</text>
  <rect class="det" x="230" y="660" width="16" height="12" rx="2"/>
  <text class="sub" x="252" y="670">process competition</text>
  <rect class="spec" x="410" y="660" width="16" height="12" rx="2"/>
  <text class="sub" x="432" y="670">iron/steel-specific service</text>
  <rect class="svc" x="620" y="660" width="16" height="12" rx="2"/>
  <text class="sub" x="642" y="670">shared energy / utility service</text>
  <rect class="prod dash" x="820" y="660" width="16" height="12" rx="2"/>
  <text class="sub" x="842" y="670">defined, not yet populated</text>
</svg>
