<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5a6472"/>
    </marker>
    <marker id="darrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a9aa8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:12px;fill:#1f2a37;}
    .lblw{font-size:12px;fill:#fff;}
    .sub{font-size:10px;fill:#43506a;}
    .subw{font-size:10px;fill:#dfe7f2;}
    .li{font-size:9.5px;fill:#243042;}
    .ttl{font-size:11px;font-weight:bold;fill:#1f2a37;}
    .edge{stroke:#5a6472;stroke-width:1.3;fill:none;}
    .dedge{stroke:#8a9aa8;stroke-width:1.1;stroke-dasharray:4 3;fill:none;}
    .sector{fill:#33415c;}
    .branch{fill:#4b5d7e;}
    .prod{fill:#3d6ea5;}
    .det{fill:#dbe8f6;stroke:#9db8d8;stroke-width:1;}
    .green{fill:#cfe3d6;stroke:#3f7d52;stroke-width:1;}
    .spec{fill:#f3e7d3;stroke:#d6b483;stroke-width:1;}
    .svc{fill:#e4efe6;stroke:#aacbb0;stroke-width:1;}
  </style>

  <!-- sector -->
  <rect class="sector" x="430" y="12" width="220" height="46" rx="7"/>
  <text class="lblw" x="540" y="34" text-anchor="middle">Electricity sector</text>
  <text class="subw" x="540" y="49" text-anchor="middle">driver: final electricity demand (MWh)</text>
  <path class="edge" d="M540,58 V72"/>
  <path class="edge" d="M300,72 H790"/>
  <path class="edge" d="M300,72 V84" marker-end="url(#arrow)"/>
  <path class="edge" d="M790,72 V84" marker-end="url(#arrow)"/>

  <!-- product / service branch -->
  <rect class="branch" x="200" y="86" width="200" height="40" rx="6"/>
  <text class="lblw" x="300" y="103" text-anchor="middle">Product — generation</text>
  <text class="subw" x="300" y="118" text-anchor="middle">split by load-duration curve</text>
  <rect class="branch" x="712" y="86" width="156" height="40" rx="6"/>
  <text class="lblw" x="790" y="103" text-anchor="middle">Service</text>
  <text class="subw" x="790" y="118" text-anchor="middle">storage · transmission · CCS</text>

  <!-- load nodes -->
  <path class="edge" d="M300,126 V138"/>
  <path class="edge" d="M110,138 H470"/>
  <path class="edge" d="M110,138 V150" marker-end="url(#arrow)"/>
  <path class="edge" d="M300,138 V150" marker-end="url(#arrow)"/>
  <path class="edge" d="M470,138 V150" marker-end="url(#arrow)"/>

  <rect class="prod" x="44" y="150" width="132" height="34" rx="6"/>
  <text class="lblw" x="110" y="171" text-anchor="middle">Base Load</text>
  <rect class="prod" x="234" y="150" width="132" height="34" rx="6"/>
  <text class="lblw" x="300" y="171" text-anchor="middle">Shoulder Load</text>
  <rect class="prod" x="404" y="150" width="132" height="34" rx="6"/>
  <text class="lblw" x="470" y="171" text-anchor="middle">Peak Load</text>

  <!-- base techs -->
  <rect class="det" x="44" y="196" width="200" height="200" rx="6"/>
  <text class="ttl" x="54" y="214">Base Load — widest set</text>
  <text class="li" x="54" y="231" style="fill:#2c6e49">VRE: wind (on/off, +battery/seasonal),</text>
  <text class="li" x="64" y="244" style="fill:#2c6e49">solar PV (+battery), hydro river</text>
  <text class="li" x="54" y="261">Firm: hydro reservoir, nuclear,</text>
  <text class="li" x="64" y="274">nuclear SMR, geothermal,</text>
  <text class="li" x="64" y="287">biomass (+CCS), waste</text>
  <text class="li" x="54" y="304">Fossil: gas CC / SC, gas CC+CCS,</text>
  <text class="li" x="64" y="317">coal (+CCS), fuel oil</text>
  <text class="sub" x="54" y="340">conventional vs renewable split:</text>
  <text class="sub" x="54" y="353">user-set or by levelized cost</text>

  <!-- shoulder -->
  <rect class="det" x="256" y="196" width="180" height="150" rx="6"/>
  <text class="ttl" x="266" y="214">Shoulder Load</text>
  <text class="li" x="266" y="231">gas CC / SC, gas CC+CCS,</text>
  <text class="li" x="266" y="246">coal, biomass (+CCS),</text>
  <text class="li" x="266" y="261">hydro reservoir,</text>
  <text class="li" x="266" y="276">wind/solar + storage</text>
  <text class="sub" x="266" y="298">part-time utilisation</text>

  <!-- peak -->
  <rect class="det" x="448" y="196" width="180" height="150" rx="6"/>
  <text class="ttl" x="458" y="214">Peak Load</text>
  <text class="li" x="458" y="231">fast-response only:</text>
  <text class="li" x="458" y="246">gas simple-cycle,</text>
  <text class="li" x="458" y="261">reservoir hydro, fuel oil,</text>
  <text class="li" x="458" y="276">wind + seasonal storage</text>
  <text class="sub" x="458" y="298">no long-start plant (e.g. nuclear)</text>

  <!-- service rail -->
  <path class="edge" d="M790,126 V140 H660 V430"/>
  <path class="edge" d="M660,180 H720" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,280 H720" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,380 H720" marker-end="url(#arrow)"/>

  <rect class="svc" x="720" y="158" width="320" height="76" rx="6"/>
  <text class="lbl" x="880" y="176" text-anchor="middle">Storage</text>
  <text class="sub" x="880" y="194" text-anchor="middle">Battery — short-duration / fast-burst balancing</text>
  <text class="sub" x="880" y="210" text-anchor="middle">Seasonal — long-duration; firms up VRE</text>
  <text class="sub" x="880" y="226" text-anchor="middle">(see Energy Storage chapter)</text>

  <rect class="spec" x="720" y="252" width="320" height="76" rx="6"/>
  <text class="lbl" x="880" y="270" text-anchor="middle">CCS — shared capture service</text>
  <text class="sub" x="880" y="288" text-anchor="middle">gas · coal · biomass variants</text>
  <text class="sub" x="880" y="306" text-anchor="middle">biomass + CCS = net-negative power</text>

  <rect class="svc" x="720" y="346" width="320" height="44" rx="6"/>
  <text class="lbl" x="880" y="365" text-anchor="middle">Transmission</text>
  <text class="sub" x="880" y="380" text-anchor="middle">delivery network (all generation requests)</text>

  <!-- service request arrow -->
  <path class="dedge" d="M628,260 C645,260 650,230 660,210" marker-end="url(#darrow)"/>
  <text class="sub" x="610" y="250" text-anchor="middle">requests</text>

  <!-- LDC mini-diagram -->
  <text class="ttl" x="120" y="430" text-anchor="middle">Load-duration curve</text>
  <path class="edge" d="M44,520 H236 M44,520 V440" />
  <path d="M44,448 C90,470 150,505 236,515" fill="none" stroke="#3d6ea5" stroke-width="1.6"/>
  <line x1="44" y1="470" x2="236" y2="470" stroke="#8a9aa8" stroke-dasharray="3 2"/>
  <line x1="44" y1="498" x2="236" y2="498" stroke="#8a9aa8" stroke-dasharray="3 2"/>
  <text class="sub" x="140" y="462" text-anchor="middle">peak</text>
  <text class="sub" x="140" y="490" text-anchor="middle">shoulder</text>
  <text class="sub" x="140" y="514" text-anchor="middle">base</text>
  <text class="sub" x="140" y="535" text-anchor="middle">hours/year →</text>

  <!-- legend -->
  <rect class="prod" x="320" y="600" width="16" height="12" rx="2"/>
  <text class="sub" x="342" y="610">load node</text>
  <rect class="det" x="440" y="600" width="16" height="12" rx="2"/>
  <text class="sub" x="462" y="610">technology competition</text>
  <rect class="svc" x="640" y="600" width="16" height="12" rx="2"/>
  <text class="sub" x="662" y="610">storage / transmission</text>
  <rect class="spec" x="820" y="600" width="16" height="12" rx="2"/>
  <text class="sub" x="842" y="610">CCS service</text>
</svg>
