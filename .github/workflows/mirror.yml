name: Mirror to backup remote

on:
  push:
    branches: [main, staging]
    tags: ['**']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push mirror
        run: git push --mirror "${{ secrets.MIRROR_URL }}"
